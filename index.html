  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function stripTags(s) { return String(s || "").replace(/<[^>]+>/g, ""); }
  function stem(html) { return String(html || "").replace(/_{3,}/g, '<span class="blank"></span>'); }

  /* ---------------- 持久化 ---------------- */
  var ST = readJSON(LS_MAIN) || {};
  ST.progress = ST.progress || {};
  ST.wrong = ST.wrong || {};
  ST.fav = ST.fav || {};
  ST.exams = ST.exams || [];
  ST.settings = ST.settings || { dark: null, minutes: 120 };
  function saveState() { writeJSON(LS_MAIN, ST); }

  var EX = readJSON(LS_EXAM);
  if (!EX || !EX.sections || !EX.sections.length) {
    EX = null;
  } else {
    EX.answers = EX.answers || {};
    EX.minutes = EX.minutes || 120;
    if (typeof EX.remaining !== "number") EX.remaining = EX.minutes * 60000;
    if (typeof EX.submitted !== "boolean") EX.submitted = false;
    if (typeof EX.running !== "boolean") EX.running = false;
  }

  var S = {
    view: "home",
    p: { type: "all", tag: "all", idx: 0, order: "seq", seed: 7, mode: "quiz",
         onlyWrong: false, onlyFav: false, reveal: false, picked: null,
         fill: [], checked: false, fillOk: [], judged: null },
    examIdx: 0,
    wtab: "wrong"
  };

  /* ---------------- 通用 UI ---------------- */
  var toastTimer = null;
  function toast(msg) {
    var el = $("#toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2000);
  }
  function applyTheme() {
    var dark = ST.settings.dark;
    if (dark === null || dark === undefined) {
      dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var b = $("#themeBtn");
    if (b) b.textContent = dark ? "☀" : "☾";
  }
  function go(v) {
    S.view = v;
    document.body.classList.remove("sheet-open");
    render();
    window.scrollTo(0, 0);
  }
  function scrollStage() {
    var el = window.innerWidth > 960 ? ($(".toolbar") || $(".stage")) : $(".stage");
    if (el) el.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  /* ---------------- 统计 ---------------- */
  function stats() {
    var t = { total: 0, done: 0, mastered: 0, byType: {} };
    TYPE_ORDER.forEach(function (k) {
      t.byType[k] = { total: 0, done: 0, mastered: 0, name: TYPE_INFO[k].name };
    });
    ALL.forEach(function (q) {
      if (!q.countable) return;
      var cell = t.byType[q.type];
      cell.total++; t.total++;
      var p = ST.progress[q.id];
      if (p) {
        if (p.seen) { cell.done++; t.done++; }
        if (p.mastered) { cell.mastered++; t.mastered++; }
      }
    });
    return t;
  }
  function progOf(id) {
    var p = ST.progress[id];
    if (!p) { p = { seen: 0, right: 0, mastered: false }; ST.progress[id] = p; }
    if (typeof p.seen !== "number") p.seen = 0;
    if (typeof p.right !== "number") p.right = 0;
    return p;
  }
  function markSeen(id) {
    var p = progOf(id);
    if (!p.seen) p.seen = 1;
    saveState();
  }
  function setResult(id, ok) {
    var p = progOf(id);
    p.seen = Math.max(1, p.seen);
    if (ok) p.right = Math.max(p.right, 1);
    if (!ok) { p.right = 0; addWrong(id); }
    else if (ST.wrong[id]) { delete ST.wrong[id]; }
    saveState();
  }
  function addWrong(id) {
    if (!ST.wrong[id]) ST.wrong[id] = { at: Date.now(), type: BYID[id].type };
    saveState();
  }
  function toggleMaster(id) {
    var p = progOf(id);
    p.mastered = !p.mastered;
    p.seen = Math.max(1, p.seen);
    if (p.mastered && ST.wrong[id]) delete ST.wrong[id];
    saveState();
    toast(p.mastered ? "已标记掌握" : "已取消掌握");
    render(true);
  }
  function toggleFav(id) {
    if (ST.fav[id]) delete ST.fav[id];
    else ST.fav[id] = Date.now();
    saveState();
    render(true);
  }

  /* ---------------- 首页 ---------------- */
  function viewHome() {
    var st = stats();
    var pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    var wrongN = Object.keys(ST.wrong).length;
    var favN = Object.keys(ST.fav).length;
    var active = EX && !EX.submitted;
    var recent = ST.exams.slice(0, 4);
    var bars = TYPE_ORDER.map(function (k) {
      var c = st.byType[k];
      var r = c.total ? Math.round(c.mastered / c.total * 100) : 0;
      return '<div class="bar-row"><span class="name">' + c.name + '</span>' +
        '<span class="bar"><i style="width:' + r + '%"></i></span>' +
        '<span class="val">' + c.mastered + "/" + c.total + "</span></div>";
    }).join("");

    var mods = [
      ["轴承寿命", "寿", "计算11~14"],
      ["轮系传动", "轮", "计算8~10"],
      ["轴系结构", "轴", "分析1~3"],
      ["受力旋向", "力", "分析4~6"],
      ["齿轮几何", "齿", "计算5~7"],
      ["机构组成", "机", "自由度/四杆"],
      ["平衡调速", "衡", "选择 3/4/10/11"],
      ["连接", "连", "螺纹/键"]
    ].map(function (m) {
      var n = ALL.filter(function (q) { return q.tags.indexOf(m[0]) >= 0 && q.countable; }).length;
      return '<button class="mod" data-act="module" data-v="' + m[0] + '">' +
        '<span class="ico">' + m[1] + '</span><b>' + m[0] + '</b><span>' + m[2] + " · " + n + " 题</span></button>";
    }).join("");

    var list = recent.length ? '<div class="examlist">' + recent.map(function (e) {
      var pass = e.score >= 60;
      return '<div class="examrow"><span>' + fmtDate(e.date) + '</span>' +
        '<b>' + trimNum(e.score) + ' / 100</b>' +
        '<span class="tag ' + (pass ? "pass" : "fail") + '">' + (pass ? "及格" : "未及格") + "</span></div>";
    }).join("") + "</div>"
      : '<div class="empty" style="padding:26px 12px"><span class="ico">◷</span>还没有模考记录<br><span class="small">完成一次 100 分模拟考后会显示在这里</span></div>';

    return '<div class="page">' +
      (active ? '<div class="banner"><div class="grow"><b>有一场考试尚未交卷</b><div class="small muted">剩余 ' +
        fmtClock(Math.max(0, EX.endAt ? EX.endAt - Date.now() : EX.remaining)) + " · 已答 " +
        answeredCount(EX) + "/27</div></div><button class=\"btn primary sm\" data-act=\"resumeExam\">继续考试 →</button></div>" : "") +
      '<section class="hero"><div>' +
        '<div class="eyebrow">机械设计基础 · 期末冲刺</div>' +
        '<h1>刷题 · 背题 · 全真模考</h1>' +
        '<p>87 道题完整收录（选择题去重后 25 道有效题），答案与解析来自定稿第 4 版；分析题 4~6 附「原图叠加」答案图。</p>' +
        '<div class="btnrow">' +
          '<button class="btn primary lg" data-act="startExam">' + (active ? "继续上次考试" : "开始 100 分模拟考") + ' →</button>' +
          '<button class="btn ghost lg" data-act="goPractice">专项刷题</button>' +
        '</div>' +
      '</div><div class="ring" style="--p:' + pct + '"><div class="ring-in"><b>' + pct +
        '<small>%</small></b><span>已练习</span></div></div></section>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + st.done + '<span class="muted" style="font-size:13px">/' + st.total + '</span></b><span>已练题数</span></div>' +
        '<div class="stat"><b>' + st.mastered + '</b><span>已掌握</span></div>' +
        '<div class="stat"><b>' + wrongN + '</b><span>错题本</span></div>' +
        '<div class="stat"><b>' + (ST.exams[0] ? trimNum(ST.exams[0].score) : "—") + '</b><span>最近模考</span></div>' +
      '</div>' +
      '<div class="split">' +
        '<div class="panel"><h2>各题型掌握率</h2><div class="bars">' + bars + '</div>' +
          '<div class="small muted" style="margin-top:12px">在题目里点「标记掌握」计入掌握率；掌握后会自动移出错题本。</div></div>' +
        '<div class="panel"><h2>最近模考</h2>' + list + "</div>" +
      "</div>" +
      '<div class="section-title"><h2>专项训练</h2><div class="line"></div>' +
        '<button class="link" data-act="goPractice">全部题目 →</button></div>' +
      '<div class="modgrid">' + mods + "</div>" +
    "</div>";
  }

  function trimNum(n) {
    return (Math.round(n * 10) / 10).toString();
  }

  /* ---------------- 刷题 ---------------- */
  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function practiceList() {
    var arr = ALL.filter(function (q) { return S.p.type === "all" || q.type === S.p.type; });
    if (S.p.tag !== "all") arr = arr.filter(function (q) { return q.tags.indexOf(S.p.tag) >= 0; });
    if (S.p.onlyWrong) arr = arr.filter(function (q) { return !!ST.wrong[q.id]; });
    if (S.p.onlyFav) arr = arr.filter(function (q) { return !!ST.fav[q.id]; });
    if (S.p.order === "random") {
      var seed = S.p.seed;
      arr = arr.slice().sort(function (a, b) { return hash(a.id + seed) - hash(b.id + seed); });
    }
    return arr;
  }
  function resetP() {
    S.p.reveal = false; S.p.picked = null; S.p.fill = []; S.p.checked = false;
    S.p.fillOk = []; S.p.judged = null;
  }
  function viewPractice() {
    var list = practiceList();
    if (S.p.idx >= list.length) S.p.idx = Math.max(0, list.length - 1);
    var q = list[S.p.idx];
    var typeChips = [{ k: "all", n: "全部" }].concat(TYPE_ORDER.map(function (k) {
      return { k: k, n: TYPE_INFO[k].name };
    })).map(function (t) {
      var n = ALL.filter(function (x) { return t.k === "all" || x.type === t.k; }).length;
      return '<button class="chip' + (S.p.type === t.k ? " on" : "") + '" data-act="setType" data-v="' +
        t.k + '">' + t.n + '<span class="n">' + n + "</span></button>";
    }).join("");

    var tagChips = MODULES.filter(function (m) { return m.key !== "all"; }).map(function (m) {
      var n = ALL.filter(function (x) { return x.tags.indexOf(m.key) >= 0; }).length;
      if (!n) return "";
      return '<button class="chip' + (S.p.tag === m.key ? " on" : "") + '" data-act="setTag" data-v="' +
        m.key + '">' + m.name + '<span class="n">' + n + "</span></button>";
    }).join("");

    var rail = list.map(function (item, i) {
      var p = ST.progress[item.id] || {};
      var cls = "railnum";
      if (p.seen) cls += " seen";
      if (p.mastered) cls += " mastered";
      if (ST.wrong[item.id]) cls += " wrong";
      if (i === S.p.idx) cls += " cur";
      return '<button class="' + cls + '" data-act="pnum" data-i="' + i + '">' + (i + 1) + "</button>";
    }).join("");

    var body = q ? practiceCard(q, list) :
      '<div class="empty"><span class="ico">🗂</span>当前筛选下没有题目<br><span class="small">试试切换题型、专项，或关闭「仅错题 / 仅收藏」</span></div>';

    return '<div class="page">' +
      '<div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">' +
        '<div><h1>专项刷题</h1><p class="lead">' + list.length + " 题 · 第 " + (list.length ? S.p.idx + 1 : 0) +
        " 题 · " + (S.p.mode === "study" ? "背题模式" : "刷题模式") + "</p></div>" +
        '<div style="margin-left:auto" class="btnrow">' +
          '<button class="btn ghost sm mobile-only" data-act="openSheet">题目列表</button>' +
          '<button class="btn ghost sm" data-act="goWrong">错题本</button>' +
        "</div></div>" +
      '<div class="toolbar">' +
        '<div class="chips scroll typechips">' + typeChips + "</div>" +
        '<div class="chips scroll">' + tagChips + "</div>" +
        '<div class="tools">' +
          '<div class="seg"><button class="' + (S.p.order === "seq" ? "on" : "") + '" data-act="order" data-v="seq">顺序</button>' +
          '<button class="' + (S.p.order === "random" ? "on" : "") + '" data-act="order" data-v="random">随机</button></div>' +
          '<div class="seg"><button class="' + (S.p.mode === "quiz" ? "on" : "") + '" data-act="mode" data-v="quiz">刷题模式</button>' +
          '<button class="' + (S.p.mode === "study" ? "on" : "") + '" data-act="mode" data-v="study">背题模式</button></div>' +
          '<button class="chip' + (S.p.onlyWrong ? " on" : "") + '" data-act="onlyWrong">仅错题 ' + Object.keys(ST.wrong).length + "</button>" +
          '<button class="chip' + (S.p.onlyFav ? " on" : "") + '" data-act="onlyFav">收藏 ' + Object.keys(ST.fav).length + "</button>" +
        "</div>" +
      "</div>" +
      '<div class="small muted kb-hint">快捷键：← → 切换题目 · A/B/C/D（或 1/2/3/4）选择选项 · 空格 显示/隐藏答案</div>' +
      '<div class="practice">' +
        '<aside class="rail"><h3>题目列表 · ' + list.length + '</h3><div class="railgrid">' + rail + "</div>" +
          '<div class="legend"><span><i style="background:var(--accent-soft)"></i>已掌握</span>' +
          '<span><i style="background:var(--bad-soft)"></i>错题</span>' +
          '<span><i style="background:var(--soft)"></i>已练</span></div></aside>' +
        '<div class="stage">' + body + "</div>" +
      "</div></div>";
  }

  function figBlock(key, caption) {
    if (!key || !IMG[key]) return "";
    var w = (typeof IMGW !== "undefined" && IMGW[key]) ? IMGW[key][0] : 900;
    var capw = Math.max(460, Math.min(1100, Math.round(w * 1.9)));
    return '<div class="fig" data-lightbox="' + key + '"><img src="' + IMG[key] + '" alt="' + esc(caption) +
      '" loading="lazy" style="max-width:' + capw + 'px"><span class="zoom">点击放大</span></div>' +
      '<div class="figcap">' + esc(caption) + "</div>";
  }

  function tagText(q) { return q.tags.join(" · "); }

  function practiceCard(q, list) {
    var reveal = S.p.mode === "study" || S.p.reveal;
    var p = ST.progress[q.id] || {};
    var head = '<div class="qhead"><span class="pill ' + q.type + '">' + TYPE_INFO[q.type].short + '</span>' +
      '<span class="qmeta">第 ' + (S.p.idx + 1) + " 题 · " + TYPE_INFO[q.type].name + " " + q.n +
      " · " + tagText(q) + "</span>" + (q.dup ? '<span class="tag gold">重题</span>' : "") +
      (q.demo ? '<span class="tag gold">背记</span>' : "") +
      "<span class=\"spacer\"></span>" +
      '<button class="chip tiny' + (p.mastered ? " done" : "") + '" data-act="master" data-id="' + q.id + '">' +
      (p.mastered ? "✓ 已掌握" : "标记掌握") + "</button>" +
      '<button class="starbtn' + (ST.fav[q.id] ? " on" : "") + '" data-act="star" data-id="' + q.id +
      '" title="收藏">★</button></div>';

    var text = '<div class="qtext">' + stem(q.q) + "</div>";
    var extra = "";
    if (q.type === "analysis" && q.given) extra += '<div class="qextra">已知：' + q.given + "</div>";
    if (q.type === "calc" && q.given) extra += '<div class="qextra">已知：' + q.given + "</div>";

    var fig = "";
    if (q.img) fig = figBlock(q.img, q.type === "analysis" ? "图 4-" + q.n + " 原题图" : "图 5-" + q.n + " 原题图");
    if (q.type === "short" && q.img) fig = figBlock(q.img, "题图");

    var body = "", foot = "";
    if (q.type === "fill") {
      if (q.demo) {
        body = '<div class="qextra">本题在原卷中已填好（高副 1 个约束、保留 2 个自由度），作为结论记忆即可。</div>';
      } else if (!reveal) {
        body = '<div class="fillgrid">' + q.blanks.map(function (_, i) {
          var cls = S.p.checked ? (S.p.fillOk[i] ? " ok" : " bad") : "";
          return '<div class="fillrow"><label>空' + CN[i] + '</label><input class="inp' + cls +
            '" data-pfill="' + i + '" value="' + esc(S.p.fill[i] || "") + '" placeholder="输入答案，可只写关键词"></div>';
        }).join("") + "</div>";
        if (!S.p.checked) body += '<div class="btnrow" style="margin-top:14px"><button class="btn primary" data-act="checkFill">检查答案</button></div>';
        else body += '<div style="margin-top:12px">' + (S.p.fillOk.every(Boolean)
          ? '<span class="feedback ok">✓ 全部正确</span>'
          : '<span class="feedback bad">✗ 有错误，对照答案看看</span>') + "</div>";
      }
      foot = '<button class="btn ghost sm" data-act="reveal">' + (reveal ? "隐藏答案" : "查看答案") + "</button>";
    } else if (q.type === "mcq") {
      var show = reveal || S.p.checked;
      body = '<div class="opts">' + q.opts.map(function (o, i) {
        var L = "ABCD"[i], cls = "opt";
        if (show && L === q.key) cls += " ok";
        else if (S.p.picked === L && show) cls += " bad";
        else if (S.p.picked === L) cls += " sel";
        return '<button class="' + cls + '" data-act="pick" data-k="' + L + '"' + (show ? " disabled" : "") +
          '><i>' + L + "</i><span>" + o + "</span></button>";
      }).join("") + "</div>";
      if (!show) body += '<div class="btnrow" style="margin-top:14px"><button class="btn primary" data-act="submitMcq"' +
        (S.p.picked ? "" : " disabled") + ">提交答案</button></div>";
      else if (S.p.picked) body += '<div style="margin-top:12px">' +
        (S.p.picked === q.key ? '<span class="feedback ok">✓ 回答正确</span>' : '<span class="feedback bad">✗ 正确答案 ' + q.key + "</span>") + "</div>";
      foot = '<button class="btn ghost sm" data-act="reveal">' + (reveal ? "隐藏答案" : "查看答案") + "</button>";
    } else {
      foot = '<button class="btn primary sm" data-act="reveal">' + (reveal ? "收起答案" : "查看答案") + "</button>";
      if (reveal) foot += '<button class="btn ghost sm" data-act="selfJudge" data-v="1">我做对了</button>' +
        '<button class="btn ghost sm" data-act="selfJudge" data-v="0">没做对</button>';
    }

    var ans = reveal ? answerBlock(q) : "";
    foot += '<button class="btn ghost sm" data-act="pPrev"' + (S.p.idx <= 0 ? " disabled" : "") + ">← 上一题</button>" +
      '<button class="btn primary sm" data-act="pNext"' + (S.p.idx >= list.length - 1 ? " disabled" : "") + ">下一题 →</button>" +
      '<span class="pos"><b>' + (S.p.idx + 1) + "</b> / " + list.length + "</span>";

    return '<article class="qcard" data-qid="' + q.id + '">' + head + text + extra + fig + body + ans +
      '<div class="qnav">' + foot + "</div></article>";
  }

  function tableBlock(head, rows) {
    if (!rows || !rows.length) return "";
    return '<table class="tbl"><thead><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
      "</tr></thead><tbody>" + rows.map(function (r) {
        return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>";
      }).join("") + "</tbody></table>";
  }

  function stepsBlock(steps) {
    if (!steps || !steps.length) return "";
    return '<div class="steps">' + steps.map(function (s) {
      return '<div class="step"><h4>' + s[0] + "</h4><p>" + s[1] + "</p></div>";
    }).join("") + "</div>";
  }

  function answerBlock(q) {
    var h = '<div class="answer"><div class="ahead">参考答案与解析</div>';
    if (q.type === "fill") {
      h += '<div class="ansline"><b>' + q.blanks.map(function (b, i) {
        return (q.blanks.length > 1 ? CN[i] + " " : "") + "<span class=\"k\">" + b + "</span>";
      }).join("　") + "</b></div>";
      h += '<div class="note"><span class="nt">解析</span>' + q.note + "</div>";
    } else if (q.type === "mcq") {
      h += '<div class="ansline"><b>正确答案：' + q.key + "．" + q.keyText + "</b></div>";
      h += '<div class="note"><span class="nt">解析</span>' + q.note + "</div>";
    } else if (q.type === "short") {
      q.ans.forEach(function (a) { h += '<div class="ansline">' + a + "</div>"; });
    } else if (q.type === "analysis") {
      if (q.intro) h += '<div class="ansline"><b>分析思路：</b>' + q.intro + "</div>";
      if (q.items.length) h += tableBlock(["序号", "错误内容", "正确做法 / 说明"], q.items);
      if (q.steps.length) h += stepsBlock(q.steps);
      if (q.table.length) h += tableBlock(["轴 / 齿轮", "转向", "轴向力 / 旋向"], q.table);
      if (q.result) h += '<div class="result-line">结论：' + q.result + "</div>";
      q.notes.forEach(function (n) { h += '<div class="note">' + n + "</div>"; });
      if (q.ansImg) {
        h += '<div class="ansfig">' + figBlock(q.ansImg, "图 4-" + q.n + "-答 答案图（第 4 版定稿，原图叠加标注）") + "</div>";
      }
    } else if (q.type === "calc") {
      if (q.given) h += '<div class="ansline"><b>已知：</b>' + q.given + "</div>";
      h += stepsBlock(q.steps);
      if (q.result) h += '<div class="result-line">结果：' + q.result + "</div>";
      q.notes.forEach(function (n) { h += '<div class="note">' + n + "</div>"; });
    }
    return h + "</div>";
  }

  /* ---------------- 模考 ---------------- */
  function ansOf(qid) {
    if (!EX.answers[qid]) EX.answers[qid] = {};
    return EX.answers[qid];
  }
  var saveTimer = null;
  function saveExamSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { writeJSON(LS_EXAM, EX); }, 350);
  }
  function beginExam() {
    if (EX && !EX.submitted) {
      if (!confirm("已有一场未交卷的考试，重新开始将丢弃当前作答，确定吗？")) return;
    }
    EX = genPaper(ST.settings.minutes || 120);
    EX.running = true;
    EX.endAt = Date.now() + EX.remaining;
    S.examIdx = 0;
    writeJSON(LS_EXAM, EX);
    S.view = "exam";
    render();
    window.scrollTo(0, 0);
    toast("考试开始，120 分钟倒计时");
  }
  function gradeExam() {
    if (!EX || EX.submitted) return;
    EX.remaining = EX.running && EX.endAt ? Math.max(0, EX.endAt - Date.now()) : EX.remaining;
    EX.running = false; EX.endAt = null; EX.submitted = true;
    EX.endedAt = Date.now();
    EX.used = EX.minutes * 60000 - EX.remaining;
    paperItems(EX).forEach(function (it) {
      var q = BYID[it.qid], a = EX.answers[it.qid] || (EX.answers[it.qid] = {});
      if (it.section === "fill") {
        a.v = a.v || [];
        a.ok = q.blanks.map(function (_, i) { return fuzzy(a.v[i] || "", q.accept[i]); });
      } else if (it.section !== "mcq") {
        if (typeof a.score !== "number") a.score = 0;
      }
    });
    var sc = scoreOf(EX);
    var by = {};
    Object.keys(sc.sections).forEach(function (k) {
      by[k] = { s: Math.round(sc.sections[k].score * 10) / 10, m: sc.sections[k].max };
    });
    ST.exams.unshift({ id: EX.id, date: Date.now(), score: sc.total, byType: by, used: EX.used });
    ST.exams = ST.exams.slice(0, 30);
    saveState();
    writeJSON(LS_EXAM, EX);
    S.view = "result";
    render();
    window.scrollTo(0, 0);
  }
  function submitExam(auto) {
    if (!EX || EX.submitted) return;
    var un = 27 - answeredCount(EX);
    if (!auto && un > 0 && !confirm("还有 " + un + " 题未作答，确定要交卷吗？")) return;
    gradeExam();
    toast(auto ? "考试时间到，已自动交卷" : "已交卷");
  }

  function viewExamIntro() {
    var last = ST.exams[0];
    var rows = [
      ["一、填空题", "10 题 × 2 分", "20 分", "双空题每空 1 分"],
      ["二、选择题", "7 题 × 2 分", "14 分", "去重后 25 题中随机"],
      ["三、简答题", "4 题 × 5 分", "20 分", "随机"],
      ["四、分析题", "2 题 × 8 分", "16 分", "轴系改错 1 + 受力旋向 1"],
      ["五、计算题", "4 题", "30 分", "自由度 7 + 齿轮 7 + 轮系 8 + 轴承 8"],
      ["合计", "27 题", "100 分", "60 分及格"]
    ];
    return '<div class="page"><h1>100 分全真模拟考</h1>' +
      '<p class="lead">按考纲分值分层随机抽题；倒计时 120 分钟，可暂停/重置；交卷后自动批改选择题与填空题，主观题对照答案自评。</p>' +
      '<div class="btnrow" style="margin:18px 0 4px">' +
      '<button class="btn primary lg" data-act="beginExam">开始考试 →</button>' +
      (EX && EX.submitted ? '<button class="btn ghost lg" data-act="viewResult">查看上次批改</button>' : '') +
      (last ? '<span class="muted small">上次：' + trimNum(last.score) + " 分（" + fmtDate(last.date) + "）</span>" : "") +
      "</div>" +
      '<div class="panel" style="margin-top:18px">' +
      '<div class="plan">' + rows.map(function (r, i) {
        return '<div class="prow' + (i === rows.length - 1 ? " total" : "") + '">' +
          '<span class="pn">' + r[0] + '</span><span class="pd">' + r[1] + '</span>' +
          '<b class="ps">' + r[2] + '</b><span class="pe">' + r[3] + "</span></div>";
      }).join("") + "</div></div>" +
      '<div class="panel" style="margin-top:14px"><h2>作答说明</h2>' +
      '<div class="small muted" style="line-height:2">· 选择题点选项即可；填空题输入关键词（自动忽略空格、支持同义写法）。<br>' +
      '· 简答/分析/计算题可以直接在纸上作答，页面里的文本框只用来随手记要点，不强制填写。<br>' +
      '· 右上角答题卡可跳转任意题号；标记的题会显示小圆点。<br>' +
      '· 考试中断网/刷新不会丢答案，重新打开可继续。</div></div></div>';
  }

  function examTimerHTML() {
    var rem = EX.running && EX.endAt ? Math.max(0, EX.endAt - Date.now()) : EX.remaining;
    var cls = "timer" + (rem < 5 * 60000 ? " danger" : rem < 20 * 60000 ? " warn" : "");
    return '<div class="' + cls + '" id="timer">' + fmtClock(rem) +
      '<small>' + (EX.running ? "剩余" : "已暂停") + "</small></div>";
  }

  function viewExam() {
    if (!EX || EX.submitted) return viewExamIntro();
    var items = paperItems(EX);
    var it = items[S.examIdx];
    var q = BYID[it.qid];
    var a = ansOf(it.qid);
    var done = answeredCount(EX);

    var input = "";
    if (it.section === "fill") {
      a.v = a.v || [];
      input = '<div class="fillgrid">' + q.blanks.map(function (_, i) {
        return '<div class="fillrow"><label>空' + CN[i] + '</label><input class="inp" data-efill="1" data-qid="' +
          q.id + '" data-i="' + i + '" value="' + esc(a.v[i] || "") + '" placeholder="填写答案"></div>';
      }).join("") + "</div>";
    } else if (it.section === "mcq") {
      input = '<div class="opts">' + q.opts.map(function (o, i) {
        var L = "ABCD"[i];
        return '<button class="opt' + (a.v === L ? " sel" : "") + '" data-act="examPick" data-k="' + L +
          '"><i>' + L + "</i><span>" + o + "</span></button>";
      }).join("") + "</div>";
    } else {
      input = '<div style="margin-top:14px"><textarea class="inp" data-note="1" data-qid="' + q.id +
        '" rows="3" placeholder="可选：随手记下要点（正式作答建议写在纸上）">' + esc(a.note || "") + "</textarea></div>";
    }

    var fig = q.img ? figBlock(q.img, q.type === "analysis" ? "图 4-" + q.n + " 原题图" : "图 5-" + q.n + " 原题图") : "";
    if (q.type === "short" && q.img) fig = figBlock(q.img, "题图");

    var nums = 0;
    var sheet = EX.sections.map(function (sec) {
      var cells = sec.items.map(function (x) {
        var n = ++nums;
        var ax = EX.answers[x.qid] || {};
        var answered = false;
        if (sec.key === "fill") answered = (ax.v || []).some(function (v) { return String(v || "").trim(); });
        else if (sec.key === "mcq") answered = !!ax.v;
        else answered = String(ax.note || "").trim().length > 0;
        var cls = "snum" + (answered ? " done" : "") + (ax.flag ? " flag" : "") + (n - 1 === S.examIdx ? " cur" : "");
        return '<button class="' + cls + '" data-act="gotoExam" data-i="' + (n - 1) + '">' + n + "</button>";
      }).join("");
      var secDone = sec.items.filter(function (x) {
        var ax = EX.answers[x.qid] || {};
        if (sec.key === "fill") return (ax.v || []).some(function (v) { return String(v || "").trim(); });
        if (sec.key === "mcq") return !!ax.v;
        return String(ax.note || "").trim().length > 0;
      }).length;
      return '<div class="sheetsec"><div class="st"><span>' + sec.title + "</span><span>" + secDone + "/" +
        sec.items.length + "</span></div><div class=\"sheetgrid\">" + cells + "</div></div>";
    }).join("");

    return '<div class="page" style="padding-top:8px">' +
      '<div class="examtop">' + examTimerHTML() +
        '<div class="examprog">已答 <b>' + done + "</b> / 27</div>" +
        '<span class="spacer"></span>' +
        '<button class="btn ghost sm" data-act="pause">' + (EX.running ? "暂停" : "继续") + "</button>" +
        '<button class="iconbtn" data-act="resetTimer" title="重置倒计时" aria-label="重置倒计时">↺</button>' +
        '<button class="btn ghost sm mobile-only" data-act="openSheet">答题卡</button>' +
        '<button class="btn primary sm" data-act="submitExam">交卷</button>' +
      "</div>" +
      '<div class="exam"><aside class="sheet"><h3>答题卡</h3>' + sheet +
        '<div class="legend"><span><i style="background:var(--accent-soft)"></i>已答</span>' +
        '<span><i style="background:var(--accent)"></i>当前</span><span><i style="background:var(--warn)"></i>标记</span></div>' +
        '<button class="btn danger sm" style="width:100%;margin-top:12px" data-act="submitExam">交卷并批改</button></aside>' +
        '<div class="stage"><article class="qcard" data-qid="' + q.id + '">' +
        '<div class="qhead"><span class="pill ' + q.type + '">' + TYPE_INFO[q.type].short + "</span>" +
        '<span class="qmeta">第 ' + it.no + " 题 / 27 · 本题 " + it.score + " 分 · " + tagText(q) + "</span>" +
        '<span class="spacer"></span><button class="chip tiny' + (a.flag ? " done" : "") + '" data-act="flagExam">' +
        (a.flag ? "⚑ 已标记" : "⚐ 标记") + "</button></div>" +
        '<div class="qtext">' + stem(q.q) + "</div>" +
        (q.given ? '<div class="qextra">已知：' + q.given + "</div>" : "") +
        fig + input +
        '<div class="qnav"><button class="btn ghost sm" data-act="examPrev"' + (S.examIdx <= 0 ? " disabled" : "") +
        ">← 上一题</button><button class=\"btn primary sm\" data-act=\"examNext\"" +
        (S.examIdx >= 26 ? " disabled" : "") + ">下一题 →</button><span class=\"pos\"><b>" +
        (S.examIdx + 1) + "</b> / 27</span></div></article></div>" +
      "</div></div>";
  }

  /* ---------------- 批改页 ---------------- */
  function fillCmp(it, q) {
    var a = EX.answers[q.id] || {};
    var per = it.score / Math.max(1, q.blanks.length);
    return q.blanks.map(function (b, i) {
      var ok = !!(a.ok && a.ok[i]);
      var mine = (a.v && a.v[i]) || "";
      return '<div class="cmp" style="margin-top:8px">' +
        '<div class="box ' + (ok ? "ok" : "bad") + '"><span>空' + CN[i] + " 你的答案</span>" + (mine ? esc(stripTags(mine)) : '<i class="muted">未作答</i>') + "</div>" +
        '<div class="box"><span>参考答案</span>' + b + "</div></div>" +
        '<div class="btnrow" style="margin-top:8px"><button class="btn sm ' + (ok ? "ghost" : "primary") +
        '" data-act="toggleBlank" data-qid="' + q.id + '" data-i="' + i + '">' +
        (ok ? "改判为 ×" : "改判为 ✓（+" + trimNum(per) + " 分）") + "</button></div>";
    }).join("");
  }

  function resultCard(it) {
    var q = BYID[it.qid];
    var a = EX.answers[it.qid] || {};
    var sc = itemScore(EX, it);
    var body = "";
    if (it.section === "mcq") {
      var mine = a.v || "—";
      body = '<div class="cmp">' +
        '<div class="box ' + (mine === q.key ? "ok" : "bad") + '"><span>你的选择</span>' + mine + "</div>" +
        '<div class="box"><span>正确答案</span>' + q.key + "．" + q.keyText + "</div></div>" +
        '<div class="note"><span class="nt">解析</span>' + q.note + "</div>";
    } else if (it.section === "fill") {
      body = fillCmp(it, q) + '<div class="note"><span class="nt">解析</span>' + q.note + "</div>";
    } else {
      body = '<div class="scorebar"><span class="lab">本题得分</span>' +
        '<input type="range" min="0" max="' + it.score + '" step="0.5" value="' + (a.score || 0) +
        '" data-score="1" data-qid="' + q.id + '">' +
        '<b class="cur" id="sv-' + q.id + '">' + trimNum(a.score || 0) + "</b>" +
        '<span class="max">/ ' + it.score + "</span>" +
        '<div class="quick"><button data-act="qscore" data-qid="' + q.id + '" data-v="0">0</button>' +
        '<button data-act="qscore" data-qid="' + q.id + '" data-v="half">半分</button>' +
        '<button data-act="qscore" data-qid="' + q.id + '" data-v="max">满分</button></div></div>' +
        '<details class="ansdet" open><summary>标准答案与分步解析</summary>' + answerBlock(q) + "</details>";
    }
    return '<div class="gradecard" id="g-' + q.id + '"><div class="gradehead">' +
      '<span class="pill ' + q.type + '">' + TYPE_INFO[q.type].short + "</span>" +
      '<b>第 ' + it.no + " 题</b><span class=\"small muted\">" + it.score + " 分</span>" +
      '<span class="spacer"></span><span class="tag ' + (sc >= it.score ? "pass" : sc > 0 ? "gold" : "fail") +
      '" id="sc-' + q.id + '">得 ' + trimNum(sc) + " 分</span></div>" +
      '<div class="qtext" style="font-size:14.5px;margin-bottom:8px">' + stem(q.q) + "</div>" +
      (q.img ? '<div class="fig" data-lightbox="' + q.img + '"><img src="' + IMG[q.img] + '" loading="lazy" alt=""><span class="zoom">点击放大</span></div>' : "") +
      body + "</div>";
  }

  function viewResult() {
    var sc = scoreOf(EX);
    var pass = sc.total >= 60;
    var items = paperItems(EX);
    var doneT = Math.round((EX.used || 0) / 60000);
    var bars = TYPE_ORDER.map(function (k) {
      var s = sc.sections[k];
      var r = s.max ? Math.round(s.score / s.max * 100) : 0;
      return '<div class="bar-row"><span class="name">' + TYPE_INFO[k].name + "</span>" +
        '<span class="bar"><i id="bar-' + k + '" style="width:' + r + '%"></i></span>' +
        '<span class="val" id="barv-' + k + '">' + trimNum(s.score) + "/" + s.max + "</span></div>";
    }).join("");
    var low = items.filter(function (it) { return itemScore(EX, it) < it.score; }).length;

    return '<div class="page" style="padding-bottom:120px"><div class="result-head"><div class="scorebox">' +
      '<div class="bigscore" id="totalScore">' + trimNum(sc.total) + "<small>/100</small></div>" +
      '<div class="verdict ' + (pass ? "pass" : "fail") + '" id="verdict">' + (pass ? "✓ 及格" : "✗ 未及格（< 60）") + "</div>" +
      "</div><div><h1 style=\"margin-bottom:4px\">批改与自评</h1>" +
      '<p class="lead">选择题、填空题已自动判分；简答/分析/计算请对照答案，用滑块给出得分。分数会实时汇总。</p>' +
      '<div class="result-meta"><div><b>' + doneT + ' 分钟</b>用时</div><div><b id="statFull">' + (27 - low) +
      '</b>满分题</div><div><b id="statLow">' + low + "</b>待订正</div></div></div></div>" +
      '<div class="panel" style="margin-top:14px"><h2>各题型得分率</h2><div class="bars">' + bars + "</div></div>" +
      '<div class="gradejump">' + items.map(function (it) {
        var v = itemScore(EX, it);
        var cls = v >= it.score ? "ok" : v > 0 ? "part" : "zero";
        return '<button class="gj ' + cls + '" data-act="jump" data-qid="' + it.qid + '">' + it.no + "</button>";
      }).join("") + "</div>" +
      '<div class="section-title"><h2>逐题批改</h2><div class="line"></div>' +
      '<button class="link" data-act="toggleAllAns">展开/收起全部答案</button>' +
      '<button class="link" data-act="addWrongAll">一键收入错题本（' + low + "）</button></div>" +
      items.map(resultCard).join("") +
      '<div class="grade-summary"><div class="s"><b id="sumScore">' + trimNum(sc.total) + '</b><span> / 100</span></div>' +
      '<span class="tag ' + (pass ? "pass" : "fail") + '" id="sumVerdict">' + (pass ? "及格" : "未及格") + "</span>" +
      '<span class="spacer"></span><button class="btn ghost sm" data-act="toHome">返回首页</button>' +
      '<button class="btn primary sm" data-act="beginExam">再考一次</button></div></div>';
  }

  function refreshSummary() {
    var sc = scoreOf(EX);
    var pass = sc.total >= 60;
    var t = $("#totalScore"); if (t) t.innerHTML = trimNum(sc.total) + "<small>/100</small>";
    var s = $("#sumScore"); if (s) s.textContent = trimNum(sc.total);
    var v = $("#verdict"); if (v) { v.className = "verdict " + (pass ? "pass" : "fail"); v.textContent = pass ? "✓ 及格" : "✗ 未及格（< 60）"; }
    var sv = $("#sumVerdict"); if (sv) { sv.className = "tag " + (pass ? "pass" : "fail"); sv.textContent = pass ? "及格" : "未及格"; }
    var low = paperItems(EX).filter(function (it) { return itemScore(EX, it) < it.score; }).length;
    var b = $('[data-act="addWrongAll"]');
    if (b) b.textContent = "一键收入错题本（" + low + "）";
    var sf = $("#statFull"); if (sf) sf.textContent = String(27 - low);
    var sl = $("#statLow"); if (sl) sl.textContent = String(low);
    TYPE_ORDER.forEach(function (k) {
      var sec = sc.sections[k];
      var r = sec.max ? Math.round(sec.score / sec.max * 100) : 0;
      var b = $("#bar-" + k); if (b) b.style.width = r + "%";
      var v = $("#barv-" + k); if (v) v.textContent = trimNum(sec.score) + "/" + sec.max;
    });
    paperItems(EX).forEach(function (it) {
      var v = itemScore(EX, it);
      var tg = $("#sc-" + it.qid);
      if (tg) {
        tg.textContent = "得 " + trimNum(v) + " 分";
        tg.className = "tag " + (v >= it.score ? "pass" : v > 0 ? "gold" : "fail");
      }
      var gj = $('.gj[data-qid="' + it.qid + '"]');
      if (gj) gj.className = "gj " + (v >= it.score ? "ok" : v > 0 ? "part" : "zero");
    });
  }

  /* ---------------- 错题本 / 收藏 / 记录 ---------------- */
  function viewWrong() {
    var tab = S.wtab;
    var wrongIds = Object.keys(ST.wrong).sort(function (a, b) { return ST.wrong[b].at - ST.wrong[a].at; });
    var favIds = Object.keys(ST.fav).sort(function (a, b) { return ST.fav[b] - ST.fav[a]; });
    var tabs = '<div class="tabs">' +
      '<button class="' + (tab === "wrong" ? "on" : "") + '" data-act="wtab" data-v="wrong">错题本 ' + wrongIds.length + "</button>" +
      '<button class="' + (tab === "fav" ? "on" : "") + '" data-act="wtab" data-v="fav">收藏 ' + favIds.length + "</button>" +
      '<button class="' + (tab === "exam" ? "on" : "") + '" data-act="wtab" data-v="exam">模考记录 ' + ST.exams.length + "</button></div>";

    var body = "";
    if (tab === "wrong") {
      body = wrongIds.length ? '<div class="wlist">' + wrongIds.map(function (id) {
        var q = BYID[id]; if (!q) return "";
        return '<div class="witem"><span class="pill ' + q.type + '">' + TYPE_INFO[q.type].short + "</span>" +
          '<div class="body"><div class="small muted">' + TYPE_INFO[q.type].name + " " + q.n + " · " + tagText(q) + "</div>" +
          '<div class="qt">' + stripTags(q.q) + "</div>" +
          '<div class="acts"><button class="btn sm primary" data-act="redo" data-id="' + id + '">重做</button>' +
          '<button class="btn sm ghost" data-act="peek" data-id="' + id + '">看答案</button>' +
          '<button class="btn sm ghost" data-act="unmaster" data-id="' + id + '">已掌握，移出</button></div></div></div>';
      }).join("") + "</div>" : emptyBlock("✓", "错题本是空的", "刷题时答错会自动收录；也可以从模考批改页一键收入。");
    } else if (tab === "fav") {
      body = favIds.length ? '<div class="wlist">' + favIds.map(function (id) {
        var q = BYID[id]; if (!q) return "";
        return '<div class="witem"><span class="pill ' + q.type + '">' + TYPE_INFO[q.type].short + "</span>" +
          '<div class="body"><div class="small muted">' + TYPE_INFO[q.type].name + " " + q.n + " · " + tagText(q) + "</div>" +
          '<div class="qt">' + stripTags(q.q) + "</div>" +
          '<div class="acts"><button class="btn sm primary" data-act="redoFav" data-id="' + id + '">练习</button>' +
          '<button class="btn sm ghost" data-act="peek" data-id="' + id + '">看答案</button>' +
          '<button class="btn sm ghost" data-act="unfav" data-id="' + id + '">取消收藏</button></div></div></div>';
      }).join("") + "</div>" : emptyBlock("☆", "还没有收藏", "刷题时点题目右上角的星标即可收藏。");
    } else {
      body = ST.exams.length ? '<div class="wlist">' + ST.exams.map(function (e) {
        var pass = e.score >= 60;
        return '<div class="witem"><span class="tag ' + (pass ? "pass" : "fail") + '">' + (pass ? "及格" : "未及格") + "</span>" +
          '<div class="body"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">' +
          "<b style=\"font-size:20px\">" + trimNum(e.score) + "</b><span class=\"small muted\">/ 100 · " + fmtDate(e.date) +
          " · 用时 " + Math.round((e.used || 0) / 60000) + " 分钟</span></div>" +
          (e.byType ? '<div class="small muted" style="margin-top:4px">' + TYPE_ORDER.map(function (k) {
            var x = e.byType[k]; return x ? TYPE_INFO[k].short + " " + trimNum(x.s) + "/" + x.m : "";
          }).filter(Boolean).join(" · ") + "</div>" : "") + "</div></div>";
      }).join("") + "</div>" : emptyBlock("◷", "还没有模考记录", "去完成一次 100 分模拟考吧。");
      body += '<div style="text-align:center;margin-top:18px"><button class="btn ghost sm" data-act="clearAll">清空所有学习记录</button></div>';
    }

    return '<div class="page"><h1>错题本 · 收藏 · 记录</h1>' +
      '<p class="lead">所有数据保存在本机浏览器（localStorage），换设备/清缓存会丢失。</p>' + tabs + body + "</div>";
  }
  function emptyBlock(ico, t, d) {
    return '<div class="empty"><span class="ico">' + ico + "</span><b>" + t + "</b><br><span class=\"small\">" + d + "</span></div>";
  }

  /* ---------------- 渲染 ---------------- */
  function render(keepScroll) {
    var y = window.scrollY;
    var app = $("#app");
    var html = "";
    if (S.view === "home") html = viewHome();
    else if (S.view === "practice") html = viewPractice();
    else if (S.view === "exam") html = (EX && !EX.submitted) ? viewExam() : viewExamIntro();
    else if (S.view === "result") html = (EX && EX.submitted) ? viewResult() : viewExamIntro();
    else if (S.view === "wrong") html = viewWrong();
    app.innerHTML = html;
    var navKey = S.view === "result" ? "exam" : S.view;
    $$(".navbtn").forEach(function (b) { b.classList.toggle("on", b.dataset.nav === navKey); });
    $$(".tabbar button").forEach(function (b) { b.classList.toggle("on", b.dataset.nav === navKey); });
    if (keepScroll) window.scrollTo(0, y);
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener("click", function (e) {
    var lbImg = e.target.closest("#lb img");
    if (lbImg) {
      lbImg.classList.toggle("zoom2");
      lb.classList.toggle("zoomed", lbImg.classList.contains("zoom2"));
      return;
    }
    if (e.target.closest("#lb")) { closeLB(); return; }

    var t = e.target.closest("[data-act]");
    if (!t) {
      var fig = e.target.closest(".fig");
      if (fig && fig.dataset.lightbox) { openLB(IMG[fig.dataset.lightbox]); return; }
      var nav = e.target.closest("[data-nav]");
      if (nav) { go(nav.dataset.nav); }
      return;
    }
    if (t.disabled) return;
    var act = t.dataset.act;

    switch (act) {
      case "nav":
        go(t.dataset.v); break;
      case "startExam":
        if (EX && !EX.submitted) go("exam"); else beginExam();
        break;
      case "resumeExam": go("exam"); break;
      case "beginExam": beginExam(); break;
      case "viewResult": S.view = "result"; render(); window.scrollTo(0, 0); break;
      case "goPractice": S.p.onlyWrong = false; S.p.onlyFav = false; go("practice"); break;
      case "goWrong": go("wrong"); break;
      case "toHome": go("home"); break;
      case "module":
        S.p.tag = t.dataset.v; S.p.type = "all"; S.p.idx = 0; S.p.onlyWrong = false; S.p.onlyFav = false;
        resetP(); go("practice"); break;

      /* practice */
      case "setType":
        S.p.type = t.dataset.v; S.p.idx = 0; resetP(); render(true); break;
      case "setTag":
        S.p.tag = t.dataset.v; S.p.idx = 0; resetP(); render(true); break;
      case "order":
        S.p.order = t.dataset.v; if (S.p.order === "random") S.p.seed = Math.floor(Math.random() * 1e9);
        S.p.idx = 0; resetP(); render(true); break;
      case "mode":
        S.p.mode = t.dataset.v; S.p.reveal = false; S.p.checked = false; S.p.picked = null;
        render(true); break;
      case "onlyWrong":
        S.p.onlyWrong = !S.p.onlyWrong; if (S.p.onlyWrong) S.p.onlyFav = false; S.p.idx = 0; resetP(); render(true); break;
      case "onlyFav":
        S.p.onlyFav = !S.p.onlyFav; if (S.p.onlyFav) S.p.onlyWrong = false; S.p.idx = 0; resetP(); render(true); break;
      case "openSheet": document.body.classList.add("sheet-open"); break;
      case "closeSheet": document.body.classList.remove("sheet-open"); break;
      case "pnum":
        S.p.idx = +t.dataset.i; resetP(); document.body.classList.remove("sheet-open"); render(); scrollStage(); break;
      case "pPrev":
        if (S.p.idx > 0) { S.p.idx--; resetP(); render(); scrollStage(); } break;
      case "pNext":
        if (S.p.idx < practiceList().length - 1) { S.p.idx++; resetP(); render(); scrollStage(); } break;
      case "reveal":
        S.p.reveal = !S.p.reveal;
        if (S.p.reveal) markSeen(practiceList()[S.p.idx].id);
        render(true); break;
      case "star":
        toggleFav(t.dataset.id); break;
      case "master":
        toggleMaster(t.dataset.id); break;
      case "pick":
        S.p.picked = t.dataset.k; render(true); break;
      case "submitMcq": {
        var qm = practiceList()[S.p.idx];
        S.p.checked = true; S.p.reveal = true; markSeen(qm.id);
        setResult(qm.id, S.p.picked === qm.key);
        render(true);
        break;
      }
      case "checkFill": {
        var qf = practiceList()[S.p.idx];
        var ok = qf.blanks.map(function (_, i) { return fuzzy(S.p.fill[i] || "", qf.accept[i]); });
        S.p.fillOk = ok; S.p.checked = true; S.p.reveal = true; markSeen(qf.id);
        setResult(qf.id, ok.every(Boolean));
        render(true);
        break;
      }
      case "selfJudge": {
        var qs = practiceList()[S.p.idx];
        setResult(qs.id, t.dataset.v === "1");
        S.p.judged = t.dataset.v === "1";
        toast(t.dataset.v === "1" ? "已记录：答对" : "已加入错题本");
        render(true);
        break;
      }

      /* exam */
      case "resetTimer":
        if (confirm("重置倒计时为 " + EX.minutes + " 分钟？已作答内容不会丢失。")) {
          EX.remaining = EX.minutes * 60000;
          EX.endAt = EX.running ? Date.now() + EX.remaining : null;
          writeJSON(LS_EXAM, EX); render(true); toast("倒计时已重置");
        }
        break;
      case "pause":
        if (EX.running) {
          EX.remaining = Math.max(0, EX.endAt - Date.now());
          EX.running = false; EX.endAt = null;
        } else {
          EX.endAt = Date.now() + EX.remaining; EX.running = true;
        }
        writeJSON(LS_EXAM, EX); render(true); break;
      case "flagExam": {
        var af = ansOf(paperItems(EX)[S.examIdx].qid);
        af.flag = !af.flag; writeJSON(LS_EXAM, EX); render(true); break;
      }
      case "examPick": {
        var ae = ansOf(paperItems(EX)[S.examIdx].qid);
        ae.v = t.dataset.k; saveExamSoon(); render(true); break;
      }
      case "examPrev":
        if (S.examIdx > 0) { S.examIdx--; render(); scrollStage(); } break;
      case "examNext":
        if (S.examIdx < 26) { S.examIdx++; render(); scrollStage(); } break;
      case "gotoExam":
        S.examIdx = +t.dataset.i; document.body.classList.remove("sheet-open");
        render(); scrollStage(); break;
      case "submitExam":
        submitExam(false); break;

      /* result */
      case "toggleBlank": {
        var id = t.dataset.qid, bi = +t.dataset.i;
        var ar = EX.answers[id];
        ar.ok[bi] = !ar.ok[bi];
        writeJSON(LS_EXAM, EX);
        render(true); refreshSummary(); break;
      }
      case "qscore": {
        var qid = t.dataset.qid, v = t.dataset.v;
        var item = paperItems(EX).filter(function (x) { return x.qid === qid; })[0];
        var val = v === "max" ? item.score : v === "half" ? item.score / 2 : 0;
        EX.answers[qid].score = val;
        writeJSON(LS_EXAM, EX);
        var rng = $('[data-score][data-qid="' + qid + '"]');
        if (rng) rng.value = val;
        var lab = $("#sv-" + qid); if (lab) lab.textContent = trimNum(val);
        var tg = $("#sc-" + qid);
        if (tg) { tg.textContent = "得 " + trimNum(val) + " 分"; tg.className = "tag " + (val >= item.score ? "pass" : val > 0 ? "gold" : "fail"); }
        refreshSummary(); break;
      }
      case "jump": {
        var g = $("#g-" + t.dataset.qid);
        if (g) g.scrollIntoView({ block: "start", behavior: "smooth" });
        break;
      }
      case "toggleAllAns": {
        var ds = $$(".ansdet");
        var openAll = ds.some(function (d) { return !d.open; });
        ds.forEach(function (d) { d.open = openAll; });
        t.textContent = openAll ? "收起全部答案" : "展开全部答案";
        break;
      }
      case "addWrongAll": {
        var n = 0;
        paperItems(EX).forEach(function (it) {
          if (itemScore(EX, it) < it.score) { addWrong(it.qid); n++; }
        });
        toast(n ? "已收入 " + n + " 道错题" : "本次没有需要订正的题");
        break;
      }

      /* wrong book */
      case "wtab": S.wtab = t.dataset.v; render(true); break;
      case "redo":
        focusQuestion(t.dataset.id, true, false); break;
      case "redoFav":
        focusQuestion(t.dataset.id, false, true); break;
      case "peek":
        focusQuestion(t.dataset.id, false, false, true); break;
      case "unmaster":
        if (ST.wrong[t.dataset.id]) delete ST.wrong[t.dataset.id];
        var pp = progOf(t.dataset.id); pp.mastered = true;
        saveState(); toast("已移出错题本"); render(true); break;
      case "unfav":
        delete ST.fav[t.dataset.id]; saveState(); render(true); break;
      case "clearAll":
        if (confirm("确定清空所有进度、错题、收藏和模考记录吗？此操作不可恢复。")) {
          localStorage.removeItem(LS_MAIN); localStorage.removeItem(LS_EXAM);
          ST = { progress: {}, wrong: {}, fav: {}, exams: [], settings: { dark: ST.settings.dark, minutes: 120 } };
          EX = null; S.view = "home"; saveState(); render(); toast("已清空");
        }
        break;
    }
  });

  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.matches("[data-pfill]")) {
      S.p.fill[+el.dataset.pfill] = el.value;
    } else if (el.matches("[data-efill]")) {
      var a = ansOf(el.dataset.qid); a.v = a.v || [];
      a.v[+el.dataset.i] = el.value;
      saveExamSoon();
      var pr = $(".examprog"); if (pr) pr.innerHTML = "已答 <b>" + answeredCount(EX) + "</b> / 27";
    } else if (el.matches("[data-note]")) {
      ansOf(el.dataset.qid).note = el.value; saveExamSoon();
    } else if (el.matches("[data-score]")) {
      var qid = el.dataset.qid;
      EX.answers[qid].score = Number(el.value);
      var lab = $("#sv-" + qid); if (lab) lab.textContent = trimNum(el.value);
      refreshSummary(); saveExamSoon();
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.matches("[data-score]")) writeJSON(LS_EXAM, EX);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeLB(); document.body.classList.remove("sheet-open"); }

    if (S.view === "practice" && !document.body.classList.contains("sheet-open") &&
        !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "")) {
      var plist = practiceList();
      var pq = plist[S.p.idx];
      if (e.key === "ArrowLeft" && S.p.idx > 0) {
        S.p.idx--; resetP(); render(); scrollStage(); e.preventDefault(); return;
      }
      if (e.key === "ArrowRight" && S.p.idx < plist.length - 1) {
        S.p.idx++; resetP(); render(); scrollStage(); e.preventDefault(); return;
      }
      if ((e.key === " " || e.code === "Space") && !e.target.closest("button")) {
        if (pq) {
          e.preventDefault();
          S.p.reveal = !S.p.reveal;
          if (S.p.reveal) markSeen(pq.id);
          render(true);
        }
        return;
      }
      if (pq && pq.type === "mcq" && !S.p.checked && !S.p.reveal && S.p.mode === "quiz") {
        var kmap = { a: "A", b: "B", c: "C", d: "D", "1": "A", "2": "B", "3": "C", "4": "D" };
        var k = kmap[e.key.toLowerCase()];
        if (k) { e.preventDefault(); S.p.picked = k; render(true); return; }
      }
    }

    if (S.view === "exam" && !e.target.matches("input,textarea")) {
      if (e.key === "ArrowLeft" && S.examIdx > 0) { S.examIdx--; render(); scrollStage(); }
      if (e.key === "ArrowRight" && S.examIdx < 26) { S.examIdx++; render(); scrollStage(); }
    }
  });

  function focusQuestion(id, onlyWrong, onlyFav, reveal) {
    S.p.type = "all"; S.p.tag = "all"; S.p.onlyWrong = !!onlyWrong; S.p.onlyFav = !!onlyFav;
    S.p.order = "seq"; S.p.mode = reveal ? "study" : "quiz";
    resetP();
    if (reveal) S.p.reveal = true;
    var list = practiceList();
    var i = list.findIndex ? list.findIndex(function (q) { return q.id === id; }) : -1;
    S.p.idx = i >= 0 ? i : 0;
    S.view = "practice"; render(); window.scrollTo(0, 0);
  }

  /* ---------------- lightbox ---------------- */
  var lb = $("#lb"), lbimg = $("#lbimg");
  function openLB(src) {
    lbimg.src = src; lbimg.classList.remove("zoom2"); lb.classList.remove("zoomed");
    lb.classList.add("on");
    document.body.style.overflow = "hidden";
  }
  function closeLB() {
    lb.classList.remove("on", "zoomed"); document.body.style.overflow = "";
    setTimeout(function () { lbimg.src = ""; }, 200);
  }
  if (lb) lb.addEventListener("click", function (e) { if (e.target === lb) closeLB(); });

  /* ---------------- 时钟 ---------------- */
  var lastSave = 0;
  setInterval(function () {
    if (!EX || EX.submitted || !EX.running || !EX.endAt) return;
    EX.remaining = Math.max(0, EX.endAt - Date.now());
    var el = $("#timer");
    if (el) {
      el.childNodes[0].nodeValue = fmtClock(EX.remaining);
      el.className = "timer" + (EX.remaining < 5 * 60000 ? " danger" : EX.remaining < 20 * 60000 ? " warn" : "");
    }
    if (EX.remaining <= 0) { gradeExam(); toast("考试时间到，已自动交卷"); return; }
    if (Date.now() - lastSave > 5000) { writeJSON(LS_EXAM, EX); lastSave = Date.now(); }
  }, 500);

  window.addEventListener("beforeunload", function () { if (EX) writeJSON(LS_EXAM, EX); });

  /* ---------------- 初始化 ---------------- */
  applyTheme();
  $("#themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.dataset.theme === "dark";
    ST.settings.dark = !cur; saveState(); applyTheme();
  });
  $("#brandHome").addEventListener("click", function () { go("home"); });
  render();
  if (EX && !EX.submitted && EX.running && EX.endAt) {
    // 继续计时
    if (EX.endAt < Date.now()) { /* 超时 */ setTimeout(function () { if (EX && !EX.submitted) { EX.remaining = 0; gradeExam(); } }, 400); }
  }
})();

</script>
</body>
</html>
