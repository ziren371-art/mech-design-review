<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="《机械设计基础》期末复习：87 道题专项刷题、背题模式、100 分全真模拟考、错题本与进度统计。纯离线单文件。">
<title>机械设计基础 · 刷题与全真模考</title>
<style>
/* ================= 机械设计基础 · 刷题与模考 ================= */
:root{
  --bg:#f1f5f3; --bg2:#e8efec; --card:#ffffff; --ink:#14211f; --ink2:#31423f;
  --muted:#6b7f7a; --line:#dfe8e5; --line2:#eef3f1; --soft:#edf5f2; --soft2:#f7faf9;
  --accent:#0f8b76; --accent2:#0a6c5b; --accent-soft:#ddf1ec; --accent-ink:#ffffff;
  --ok:#15803d; --ok-soft:#e6f6ea; --bad:#b42318; --bad-soft:#fdeceb;
  --warn:#a16207; --warn-soft:#fdf3e0; --gold:#b7791f;
  --shadow:0 1px 2px rgba(14,42,36,.04),0 10px 30px rgba(14,42,36,.06);
  --shadow-sm:0 1px 2px rgba(14,42,36,.05);
  --r:18px; --r-sm:12px;
  --font:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#0c1413; --bg2:#0f1a18; --card:#141f1d; --ink:#e6f0ed; --ink2:#c6d6d2;
  --muted:#8ba39d; --line:#26342f; --line2:#1d2926; --soft:#192622; --soft2:#111b19;
  --accent:#37c2a7; --accent2:#2aa78f; --accent-soft:#17332c; --accent-ink:#04211b;
  --ok:#4ade80; --ok-soft:#122a1b; --bad:#f87171; --bad-soft:#2b1616;
  --warn:#fbbf24; --warn-soft:#2b2110; --gold:#e0b45a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 8% -8%, color-mix(in srgb,var(--accent) 10%, transparent), transparent 70%),
    radial-gradient(700px 460px at 100% 0%, color-mix(in srgb,var(--accent) 6%, transparent), transparent 70%);
}
[data-theme="dark"] body::before{opacity:.55}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)}
img{max-width:100%;display:block}
sub,sup{font-size:.72em;line-height:0}
sub{vertical-align:-.22em}
sup{vertical-align:.42em}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 18px}
.page{max-width:1180px;margin:0 auto;padding:22px 18px 40px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 84%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .inner{max-width:1180px;margin:0 auto;padding:0 18px;height:60px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand-mark{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;
  font-size:16px;font-weight:800;box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 35%,transparent);
}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px}
.nav{display:flex;gap:4px;margin-left:auto}
.navbtn{
  border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px;
  font-weight:600;font-size:14px;transition:.18s;
}
.navbtn:hover{background:var(--soft);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent2)}
[data-theme="dark"] .navbtn.on{color:var(--accent)}
.iconbtn{
  border:1px solid var(--line);background:var(--card);width:36px;height:36px;border-radius:11px;
  display:grid;place-items:center;font-size:16px;transition:.18s;flex:none;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

/* ---------- typography ---------- */
h1{font-size:25px;line-height:1.3;margin:0 0 6px;letter-spacing:-.3px}
h2{font-size:17px;margin:0 0 12px;letter-spacing:.2px}
h3{font-size:15px;margin:0 0 8px}
.lead{color:var(--muted);margin:0;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid transparent;border-radius:12px;padding:10px 18px;font-weight:650;font-size:14.5px;
  background:var(--soft);color:var(--ink);transition:.18s;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(145deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.ghost{background:var(--card);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn.lg{padding:13px 26px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- home ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:30px 32px;
  background:linear-gradient(135deg,var(--card) 0%,color-mix(in srgb,var(--accent) 7%,var(--card)) 100%);
  border:1px solid var(--line);box-shadow:var(--shadow);
  display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center;
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);
  pointer-events:none;
}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--accent2);margin-bottom:10px}
[data-theme="dark"] .hero .eyebrow{color:var(--accent)}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{margin:0 0 20px;color:var(--muted);max-width:520px}
.ring{
  --p:0;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--line) 0);
  position:relative;transition:background .4s;
}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.ring-in{position:relative;text-align:center;line-height:1.15}
.ring-in b{font-size:31px;letter-spacing:-1px;display:block}
.ring-in b small{font-size:13px;color:var(--muted);font-weight:600;margin-left:1px}
.ring-in span{font-size:11.5px;color:var(--muted);letter-spacing:.6px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 26px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;
  box-shadow:var(--shadow-sm);
}
.stat b{font-size:23px;letter-spacing:-.5px;display:block;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px}
.section-title h2{margin:0}
.section-title .line{flex:1;height:1px;background:var(--line)}
.section-title .link{border:0;background:none;color:var(--accent2);font-weight:650;font-size:13px}
[data-theme="dark"] .section-title .link{color:var(--accent)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow-sm)}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}

.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:66px 1fr 54px;gap:12px;align-items:center;font-size:13.5px}
.bar-row .name{font-weight:650;color:var(--ink2)}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%, #7dd3c0));transition:width .5s}
.bar-row .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}

.modgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mod{
  border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;
  text-align:left;transition:.18s;display:flex;flex-direction:column;gap:4px;
}
.mod:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.mod b{font-size:14px}
.mod span{font-size:12px;color:var(--muted)}
.mod .ico{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;font-size:14px;font-weight:800;margin-bottom:6px;font-style:normal}

.examlist{display:flex;flex-direction:column;gap:2px}
.examrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:13.5px}
.examrow:last-child{border-bottom:0}
.examrow b{font-variant-numeric:tabular-nums;font-size:16px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.tag.pass{background:var(--ok-soft);color:var(--ok)}
.tag.fail{background:var(--bad-soft);color:var(--bad)}
.tag.gold{background:var(--warn-soft);color:var(--warn)}

.banner{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(120deg,var(--accent-soft),var(--card));border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));
  border-radius:16px;padding:14px 18px;margin-bottom:18px;
}
.banner b{font-size:14.5px}
.banner .grow{flex:1;min-width:180px}

/* ---------- chips / toolbar ---------- */
.toolbar{display:flex;flex-direction:column;gap:12px;margin:18px 0 16px;scroll-margin-top:72px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;
  font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.16s;
}
.chip:hover{border-color:var(--accent);color:var(--accent2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 26%,transparent)}
.chip.tiny{padding:3px 10px;font-size:11.5px;border-radius:8px}
.chip.done{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
.mobile-only{display:none}
.chip .n{opacity:.65;font-size:11px;margin-left:4px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--accent2);box-shadow:var(--shadow-sm)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:600;user-select:none;cursor:pointer}
.toggle input{display:none}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.toggle .sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked + .sw{background:var(--accent)}
.toggle input:checked + .sw::after{transform:translateX(14px)}

/* ---------- practice layout ---------- */
.practice{display:grid;grid-template-columns:252px minmax(0,1fr);gap:18px;align-items:start}
.rail{
  position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;box-shadow:var(--shadow-sm);max-height:calc(100vh - 96px);display:flex;flex-direction:column;
}
.rail h3{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:2px 0 10px}
.railgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;overflow:auto;padding-right:2px}
.railnum{
  aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:8px;
  font-size:12px;font-weight:650;color:var(--muted);display:grid;place-items:center;padding:0;
}
.railnum:hover{border-color:var(--accent);color:var(--accent)}
.railnum.seen{background:var(--soft);color:var(--ink2)}
.railnum.mastered{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--accent2)}
.railnum.wrong{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 22%,var(--line));color:var(--bad)}
.railnum.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink) !important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.rail .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}

.stage{min-width:0;scroll-margin-top:76px}

/* ---------- question card ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 26px 18px}
.qhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.pill{font-size:11.5px;font-weight:750;letter-spacing:.4px;padding:3px 9px;border-radius:7px;background:var(--soft);color:var(--accent2)}
[data-theme="dark"] .pill{color:var(--accent)}
.pill.mcq{background:#e8eefc;color:#3155b5}
.pill.short{background:#f3ecff;color:#6b3fb5}
.pill.analysis{background:#fff0e4;color:#9a4b12}
.pill.calc{background:#e7f6f1;color:#0b6b5b}
[data-theme="dark"] .pill.mcq{background:#1b2540;color:#9db4f5}
[data-theme="dark"] .pill.short{background:#251b3a;color:#c6a9f7}
[data-theme="dark"] .pill.analysis{background:#33200f;color:#f0b07a}
[data-theme="dark"] .pill.calc{background:#12302a;color:#66d6bd}
.qmeta{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
.starbtn{border:0;background:transparent;font-size:19px;line-height:1;color:var(--line);padding:4px 6px;transition:.15s}
.starbtn:hover{color:var(--gold);transform:scale(1.12)}
.starbtn.on{color:var(--gold)}

.qtext{font-size:16.5px;line-height:1.85;font-weight:550;color:var(--ink);letter-spacing:.1px}
.qtext .blank{display:inline-block;min-width:64px;border-bottom:1.5px solid var(--accent);height:1.1em;vertical-align:-.15em;margin:0 3px}
.qextra{margin-top:10px;font-size:13.5px;color:var(--muted);background:var(--soft2);border-left:3px solid var(--line);padding:8px 12px;border-radius:0 8px 8px 0}

.fig{margin:16px 0 4px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;position:relative;cursor:zoom-in}
.fig img{width:100%;height:auto;transition:filter .2s}
.fig:hover img{filter:brightness(.98)}
.fig .zoom{position:absolute;right:10px;bottom:10px;background:rgba(12,26,22,.72);color:#fff;font-size:11px;padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px);pointer-events:none}
.figcap{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0 8px;background:var(--soft2)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;
  border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;
  font-size:15px;line-height:1.6;transition:.15s;
}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--soft2)}
.opt i{
  font-style:normal;font-weight:800;width:24px;height:24px;border-radius:7px;flex:none;
  display:grid;place-items:center;background:var(--soft);color:var(--muted);font-size:13px;
}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel i{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok i{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad i{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

/* fill inputs */
.fillgrid{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.fillrow{display:flex;align-items:center;gap:10px}
.fillrow label{font-size:12.5px;font-weight:700;color:var(--muted);width:44px;flex:none}
.inp{
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);
  font-size:15px;transition:.15s;outline:none;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.inp.ok{border-color:var(--ok);background:var(--ok-soft)}
.inp.bad{border-color:var(--bad);background:var(--bad-soft)}

/* answer */
.answer{
  margin-top:18px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));
  background:linear-gradient(180deg,var(--soft) 0%,var(--card) 140px);padding:16px 18px;
}
.answer .ahead{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:1px;color:var(--accent2);margin-bottom:10px}
[data-theme="dark"] .answer .ahead{color:var(--accent)}
.answer .ahead::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}
.ansline{font-size:15px;line-height:1.8;margin:2px 0}
.ansline b{color:var(--accent2)}
[data-theme="dark"] .ansline b{color:var(--accent)}
.ansline .k{font-weight:800;color:var(--accent2)}
.note{font-size:13.5px;color:var(--ink2);background:var(--soft2);border-radius:10px;padding:9px 12px;margin-top:10px;line-height:1.75}
.note .nt{font-weight:800;color:var(--warn);margin-right:4px}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.step{border-left:3px solid var(--accent-soft);padding-left:12px}
.step h4{margin:0 0 3px;font-size:13.5px;color:var(--accent2);font-weight:800}
[data-theme="dark"] .step h4{color:var(--accent)}
.step p{margin:0;font-size:14.5px;line-height:1.85;color:var(--ink2)}
.result-line{font-size:15px;font-weight:650;background:var(--accent-soft);color:var(--accent2);padding:9px 12px;border-radius:10px;margin-top:10px}
[data-theme="dark"] .result-line{color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px;border-radius:10px;overflow:hidden}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-size:12.5px;font-weight:800;color:var(--ink2)}
.tbl tr:nth-child(even) td{background:var(--soft2)}
.ansfig{margin-top:12px}

/* nav */
.qnav{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line2);flex-wrap:wrap}
.qnav .pos{font-size:12.5px;color:var(--muted);margin-left:auto}
.qnav .pos b{color:var(--ink)}

.feedback{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- exam ---------- */
.examtop{
  position:sticky;top:60px;z-index:45;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:14px 0 18px;box-shadow:var(--shadow-sm);
}
.timer{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.timer.warn{color:var(--warn)}
.timer.danger{color:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.55}}
.timer small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
.examprog{font-size:12.5px;color:var(--muted)}
.examprog b{color:var(--ink)}
.exam{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.sheet{
  position:sticky;top:146px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;box-shadow:var(--shadow-sm);
}
.sheet h3{font-size:12px;letter-spacing:1px;color:var(--muted);margin:0 0 10px}
.sheetsec{margin-bottom:10px}
.sheetsec .st{font-size:11.5px;font-weight:750;color:var(--ink2);margin:0 0 6px;display:flex;justify-content:space-between}
.sheetgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.snum{
  aspect-ratio:1;border:1px solid var(--line);border-radius:7px;background:var(--card);font-size:11.5px;
  font-weight:650;color:var(--muted);display:grid;place-items:center;padding:0;position:relative;
}
.snum.done{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--accent2)}
.snum.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.snum.flag::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.sheet .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.sheet .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* answer sheet drawer on mobile */
.sheet-mask{display:none}

/* ---------- result ---------- */
.result-head{
  display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 30px;box-shadow:var(--shadow);
}
.scorebox{text-align:center;min-width:170px}
.bigscore{font-size:64px;font-weight:850;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:18px;font-weight:600;color:var(--muted);letter-spacing:0}
.verdict{margin-top:8px;display:inline-flex;gap:6px;align-items:center;font-weight:750;font-size:14px;padding:5px 12px;border-radius:99px}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.result-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.result-meta div{background:var(--soft2);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted)}
.result-meta b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.gradecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.gradehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cmp .box{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:var(--soft2)}
.cmp .box span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;letter-spacing:.5px}
.cmp .box.ok{border-color:var(--ok);background:var(--ok-soft)}
.cmp .box.bad{border-color:var(--bad);background:var(--bad-soft)}
.scorebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;background:var(--soft);border-radius:12px;padding:10px 14px}
.scorebar .lab{font-size:12.5px;font-weight:750;color:var(--ink2)}
.scorebar input[type=range]{flex:1;min-width:160px}
.scorebar .cur{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;min-width:58px;text-align:center;color:var(--accent2)}
[data-theme="dark"] .scorebar .cur{color:var(--accent)}
.scorebar .max{font-size:12px;color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:650}
.quick button:hover{border-color:var(--accent);color:var(--accent2)}
.grade-summary{position:sticky;bottom:12px;z-index:30;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);margin-top:16px}
.grade-summary .s b{font-size:26px;letter-spacing:-1px}
.grade-summary .s span{font-size:12px;color:var(--muted)}

/* ---------- wrong ---------- */
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin:14px 0 18px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.wlist{display:flex;flex-direction:column;gap:10px}
.witem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:flex-start}
.witem .body{flex:1;min-width:0}
.witem .qt{font-size:14.5px;line-height:1.7;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.witem .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:56px 20px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.empty .ico{font-size:34px;display:block;margin-bottom:8px;opacity:.6}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:200;background:rgba(6,12,11,.94);display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex;animation:fade .18s}
.lb img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:6px;background:#fff;cursor:zoom-in}
.lb .close{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px}
.lb .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:12px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);z-index:300;width:max-content;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:650;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
[data-theme="dark"] .toast{background:var(--accent);color:#04211b}

/* ---------- bottom tabbar ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .nav{display:none}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1;border:0;background:transparent;display:flex;flex-direction:column;gap:2px;align-items:center;
    padding:6px 2px;border-radius:12px;font-size:10.5px;font-weight:650;color:var(--muted);
  }
  .tabbar button .i{font-size:19px;line-height:1.1}
  .tabbar button.on{color:var(--accent2);background:var(--accent-soft)}
  [data-theme="dark"] .tabbar button.on{color:var(--accent)}
  body{padding-bottom:72px}
  .toast{bottom:86px}
}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .exam{grid-template-columns:1fr}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:120;border-radius:20px 20px 0 0;
    max-height:76vh;overflow:auto;transform:translateY(105%);transition:transform .28s ease;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  body.sheet-open .sheet{transform:none}
  .sheet-mask{display:block;position:fixed;inset:0;background:rgba(4,10,9,.5);z-index:110;opacity:0;pointer-events:none;transition:.25s}
  body.sheet-open .sheet-mask{opacity:1;pointer-events:auto}
  .examtop{top:60px}
}
@media (max-width:960px){
  .practice{grid-template-columns:1fr}
  .rail{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:120;border-radius:20px 20px 0 0;
    max-height:70vh;transform:translateY(105%);transition:transform .28s ease;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  body.sheet-open .rail{transform:none}
  .railgrid{grid-template-columns:repeat(8,1fr);overflow:auto}
  .hero{grid-template-columns:1fr;padding:24px}
  .hero .ring{display:none}
  .split{grid-template-columns:1fr}
  .modgrid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .result-head{grid-template-columns:1fr;text-align:center;gap:14px}
  .result-meta{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:560px){
  .shell{padding:0 12px}
  .page{padding-left:12px;padding-right:12px}
  h1{font-size:21px}
  .hero h1{font-size:24px}
  .qcard{padding:18px 16px 14px;border-radius:16px}
  .qtext{font-size:15.5px;line-height:1.8}
  .opt{font-size:14.5px;padding:10px 12px}
  .topbar .inner{height:54px;padding:0 12px}
  .brand span.t{font-size:14px}
  .brand small{display:none}
  .examtop{top:54px;gap:8px;padding:8px 10px}
  .timer{font-size:19px}
  .cmp{grid-template-columns:1fr}
  .result-meta{grid-template-columns:1fr;gap:8px}
  .stats{gap:8px}
  .stat{padding:12px}
  .stat b{font-size:20px}
  .result-head{padding:20px}
  .bigscore{font-size:52px}
  .railnum{font-size:11px}
  .chips .chip{font-size:12.5px;padding:6px 11px}
}


/* ---------- 补充 ---------- */
.brand{border:0;background:none;padding:0;text-align:left;color:inherit}
.brand .t{font-size:15px;line-height:1.2;font-weight:700;display:block}
.brand .t small{font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.4px}
textarea.inp{width:100%;resize:vertical;line-height:1.65;padding:10px 12px;min-height:76px}
.ansdet summary{cursor:pointer;font-weight:750;color:var(--accent2);margin:8px 0 4px;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:6px}
.ansdet summary::-webkit-details-marker{display:none}
.ansdet summary::before{content:"▸";transition:.2s;display:inline-block}
.ansdet[open] summary::before{transform:rotate(90deg)}
[data-theme="dark"] .ansdet summary{color:var(--accent)}
.lb{overflow:auto}
.lb img.zoom2{transform:scale(1.75);transform-origin:center center;cursor:zoom-out;transition:transform .2s}
.witem>.tag{align-self:flex-start;margin-top:2px}
.gradecard .qtext{color:var(--ink2)}
.qtext sub,.qtext sup{color:inherit}
@media (max-width:960px){ .mobile-only{display:inline-flex} }


/* ---------- 模考配比表 ---------- */
.plan{display:flex;flex-direction:column;margin-top:4px}
.prow{display:grid;grid-template-columns:130px 110px 70px 1fr;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px dashed var(--line);font-size:13.5px}
.prow .pn{font-weight:700}
.prow .pd{color:var(--muted)}
.prow .ps{text-align:right;color:var(--accent2);font-weight:800;font-variant-numeric:tabular-nums}
.prow .pe{color:var(--muted);font-size:12.5px}
.prow.total{background:var(--soft);border-radius:10px;border:0;margin-top:10px}
.prow.total .ps{color:var(--gold)}
.chips.scroll{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%)}
@media (max-width:700px){
  .prow{grid-template-columns:1fr auto;grid-template-areas:"n s" "d d" "e e";gap:2px 10px;padding:12px 8px}
  .prow .pn{grid-area:n}.prow .ps{grid-area:s}.prow .pd{grid-area:d}.prow .pe{grid-area:e}
}
@media (max-width:900px){ #themeBtn{margin-left:auto} }
@media (max-width:560px){
  .hero .btnrow{flex-direction:column;align-items:stretch}
  .hero .btnrow .btn{width:100%}
  .qtext .blank{min-width:52px}
}


/* ---------- 手机端模考条 / 批改条 ---------- */
@media (max-width:560px){
  .examtop{flex-wrap:nowrap;gap:6px;padding:8px 10px;top:54px}
  .examtop .timer{font-size:18px;letter-spacing:0;margin-right:auto;gap:0}
  .examtop .timer small{display:none}
  .examtop .examprog{display:none}
  .examtop .spacer{display:none}
  .examtop .btn.sm{padding:7px 10px;font-size:12.5px}
  .grade-summary{bottom:82px;padding:10px 12px}
  .grade-summary .s b{font-size:22px}
  .scorebar{padding:10px}
  .scorebar .quick button{padding:4px 8px}
}


/* ---------- 批改快速跳转 ---------- */
.gradejump{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin:6px 0 4px}
.gj{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:11.5px;font-weight:700;color:var(--muted);padding:0}
.gj.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,var(--line));color:var(--ok)}
.gj.part{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 28%,var(--line));color:var(--warn)}
.gj.zero{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 24%,var(--line));color:var(--bad)}
.gj:hover{transform:translateY(-1px)}
.gradecard{scroll-margin-top:76px}
@media (max-width:700px){ .gradejump{grid-template-columns:repeat(9,1fr)} }


/* ---------- 手机端自评条 ---------- */
@media (max-width:560px){
  .scorebar{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"lab slider cur max" "quick quick quick quick";gap:8px 8px;align-items:center}
  .scorebar .lab{grid-area:lab;font-size:12px}
  .scorebar input[type=range]{grid-area:slider;min-width:0}
  .scorebar .cur{grid-area:cur;font-size:17px;min-width:24px}
  .scorebar .max{grid-area:max;font-size:11px}
  .scorebar .quick{grid-area:quick;justify-content:flex-end}
  .examtop .iconbtn{width:32px;height:32px;border-radius:9px}
}


@media (max-width:560px){
  .chips.typechips{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}
}


/* ---------- range ---------- */
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:var(--line);outline:none;accent-color:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.2);margin-top:-8px;cursor:pointer}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--card);cursor:pointer}


/* ================= 精修：图片、灯箱、深色、批改条 ================= */
.fig img{width:auto;max-width:100%;max-height:360px;height:auto;margin:0 auto}
.ansfig .fig img{max-height:420px}
.lb img.zoom2{transform:none;width:165%;max-width:none;max-height:none;height:auto;flex:none;cursor:zoom-out}
.lb.zoomed{align-items:flex-start;justify-content:flex-start}
.lb.zoomed .hint{display:none}
.lb .close{position:fixed;top:14px;right:14px;z-index:6}
[data-theme="dark"] .fig{background:#e3ebe8}
[data-theme="dark"] .fig img,[data-theme="dark"] .lb img{filter:brightness(.86) contrast(1.04)}
.kb-hint{display:none}
@media (min-width:961px){ .kb-hint{display:block;margin:-2px 0 8px;font-size:12px} }
@media (max-width:900px){
  .grade-summary{bottom:82px}
  .toast{bottom:150px}
}

.lb .close{background:rgba(8,14,13,.72);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.35)}


.bootload{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;min-height:52vh;padding:56px 20px;color:#5b6f6a;font-size:14px;line-height:1.6}
.bootload .bsub{font-size:12px;color:#93a5a1}
.blspin{width:34px;height:34px;border:3px solid #d7e6e1;border-top-color:#0f7b6c;
  border-radius:50%;animation:blspin .8s linear infinite}
@keyframes blspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <button id="brandHome" class="brand" style="border:0;background:none;padding:0;text-align:left">
      <span class="brand-mark">机</span>
      <span class="t">机械设计基础<small>刷题 · 模考 · 错题本</small></span>
    </button>
    <nav class="nav">
      <button class="navbtn on" data-nav="home">首页</button>
      <button class="navbtn" data-nav="practice">刷题</button>
      <button class="navbtn" data-nav="exam">模考</button>
      <button class="navbtn" data-nav="wrong">错题本</button>
    </nav>
    <button class="iconbtn" id="themeBtn" title="切换深色 / 浅色" aria-label="切换主题">☾</button>
  </div>
</header>

<main id="app"><div class="bootload"><div class="blspin" aria-hidden="true"></div><div>正在加载题库…</div><div class="bsub">87 道题 · 原题图随题目加载 · 首次打开稍等片刻</div></div></main>

<nav class="tabbar">
  <button class="on" data-nav="home"><span class="i">⌂</span>首页</button>
  <button data-nav="practice"><span class="i">✎</span>刷题</button>
  <button data-nav="exam"><span class="i">◷</span>模考</button>
  <button data-nav="wrong"><span class="i">⚑</span>错题本</button>
</nav>

<div class="sheet-mask" data-act="closeSheet"></div>

<div class="lb" id="lb" role="dialog" aria-label="图片预览">
  <button class="close" id="lbClose" aria-label="关闭">✕</button>
  <img id="lbimg" alt="题目图片放大预览">
  <div class="hint">点击图片可再放大 · 点击空白或按 Esc 关闭</div>
</div>

<script>

高抗塑性变形的能力"],"key":"B","keyText":"提高齿面的抗弯曲疲劳强度","note":"硬齿面齿轮的主要失效形式是轮齿折断，故按弯曲强度设计；z少、m大可使齿根厚度增大，提高抗弯曲疲劳强度。","tags":["齿轮几何"],"dup":false,"skip":false},{"id":"m22","n":22,"type":"mcq","q":"在蜗杆传动中，如果模数和蜗杆头数一定，减少蜗杆分度圆直径，将使（　）。","opts":["传动效率降低，蜗杆刚度提高","传动效率提高，蜗杆刚度降低","传动效率和蜗杆刚度都提高","传动效率和蜗杆刚度都降低"],"key":"B","keyText":"传动效率提高，蜗杆刚度降低","note":"d<sub>1<\/sub>=mq，d<sub>1<\/sub>减小则q减小，导程角γ=arctan(z<sub>1<\/sub>/q)增大，效率提高；但蜗杆直径减小、刚度下降。","tags":["蜗杆传动"],"dup":false,"skip":false},{"id":"m23","n":23,"type":"mcq","q":"受不变的载荷作用单向运转的转轴，其所受弯曲应力的性质为（　）。","opts":["脉动循环","对称循环","静应力","非对称循环"],"key":"B","keyText":"对称循环","note":"转轴转动时，轴上任一点的弯曲应力随转角作周期性变化，由拉变压、压变拉，故为对称循环变应力（而扭转剪应力为脉动循环）。","tags":["轴"],"dup":false,"skip":false},{"id":"m24","n":24,"type":"mcq","q":"某轮系的中间齿轮（惰轮）通过一滚动轴承固定在不转的心轴上，轴承内、外圈的配合满足（　）。","opts":["内圈与心轴较紧、外圈与齿轮较松","内圈、外圈配合均较紧","内圈与心轴较松、外圈与齿轮较紧","内圈、外圈配合均较松"],"key":"C","keyText":"内圈与心轴较松、外圈与齿轮较紧","note":"同上题：外圈随齿轮转动为转动套圈，应取紧配合；内圈固定不动，取较松配合。【重题说明】本题与第14题为同一道题（原卷重题），答案一致，不必重复记忆。","tags":["轴承"],"dup":true,"skip":true},{"id":"m25","n":25,"type":"mcq","q":"如需在轴上安装一对半圆键，则应将它们布置在（　）。","opts":["相隔90°","相隔120°位置","相隔180°","轴的同一母线上"],"key":"D","keyText":"轴的同一母线上","note":"成对使用的半圆键应布置在同一母线上，以便一次铣出两个键槽，保证两键受力均匀、便于加工。","tags":["连接"],"dup":false,"skip":false},{"id":"m26","n":26,"type":"mcq","q":"在机械中安装飞轮，可以（　）。","opts":["减小周期性速度波动","消除周期性速度波动","减小非周期性速度波动","消除非周期性速度波动"],"key":"A","keyText":"减小周期性速度波动","note":"飞轮储存和释放动能，只能减小（不能消除）机械的周期性速度波动；非周期性波动需用调速器。","tags":["平衡调速"],"dup":false,"skip":false}],"short":[{"id":"s1","n":1,"type":"short","q":"什么是铰链四杆机构的压力角、传动角？它的大小对机构的传力性能有何影响？铰链四杆机构的最小传动角在什么位置？","ans":["压力角 α：从动件上受力点的受力方向与该点速度方向之间所夹的锐角。","传动角 γ：压力角的余角，γ=90°−α；在几何上等于连杆与从动件（摇杆）之间所夹的锐角。","对传力性能的影响：γ 越大（α 越小），力沿从动件速度方向的有效分力越大、法向分力越小，传力性能越好、效率越高；γ 过小则机构易自锁、磨损加剧。设计时一般要求 γmin ≥ 40°；高速、大功率场合要求 γmin ≥ 50°。","最小传动角的位置：出现在曲柄与机架共线的两个位置（曲柄与机架拉直、曲柄与机架重叠）。这两个位置分别算出 γ，取其中较小者即为 γmin。"],"img":null,"tags":["四杆机构"]},{"id":"s2","n":2,"type":"short","q":"什么情况下，凸轮实际轮廓会出现变尖现象？它对凸轮机构工作有何影响？如何避免？","ans":["原因：实际轮廓是理论轮廓的等距曲线（内缩滚子半径 rr）。当理论轮廓外凸部分的最小曲率半径 ρmin 小于或等于滚子半径 rr 时（ρmin ≤ rr），实际轮廓就会出现尖点（ρmin=rr）或交叉（ρmin&lt;rr，即运动失真）。","影响：轮廓变尖处接触应力极大、磨损极快；出现交叉时从动件不能实现预期的运动规律（运动失真），并产生冲击、振动和噪声。","避免措施：①增大基圆半径，使 ρmin 增大；②减小滚子半径 rr；③使实际轮廓的最小曲率半径 ρa=ρmin−rr 满足 ρa&gt;0，通常取 ρa≥3~5 mm；④必要时修改从动件运动规律。"],"img":null,"tags":["凸轮机构"]},{"id":"s3","n":3,"type":"short","q":"为什么大多数螺纹连接都要防松？常见的防松方法有哪些？","ans":["原因：螺纹联接在冲击、振动、变载荷或温度变化的作用下，螺纹副中的摩擦力可能瞬时消失或减小，使螺纹副相对转动而松脱，导致联接失效甚至发生事故。因此联接必须有可靠的防松措施。","常见防松方法（按原理分三类）：","①摩擦防松：弹簧垫圈、对顶螺母（双螺母）、自锁螺母、尼龙圈锁紧螺母、椭圆口自锁螺母；","②机械防松：开口销与槽形螺母、止动垫圈、串联钢丝；","③永久（破坏螺纹副）防松：端部点焊、铆冲、粘接（涂厌氧胶）。"],"img":null,"tags":["连接"]},{"id":"s4","n":4,"type":"short","q":"链传动在工作时引起动载荷的主要原因是什么？","ans":["①多边形效应：链条绕在链轮上呈正多边形，链条的瞬时速度和瞬时传动比作周期性变化，产生附加动载荷；","②啮合冲击：链节与轮齿进入啮合的瞬间，链节和轮齿以一定的相对速度相碰，产生冲击载荷；","③链条的横向振动：链条在紧边、松边的垂度变化及张紧不当时产生振动，引起动载荷；","④主动链轮转速不均匀、链条速度周期性变化引起的惯性力；","⑤链节距越大、链轮齿数越少、转速越高，动载荷越大。"],"img":null,"tags":["带链传动"]},{"id":"s5","n":5,"type":"short","q":"什么是曲柄，铰链四杆机构有曲柄的条件是什么，曲柄是否为最短杆？","ans":["曲柄：能绕机架作整周回转（360°）的连架杆。","铰链四杆机构存在曲柄的条件：①最短杆与最长杆长度之和小于或等于其余两杆长度之和（格拉肖夫条件）；②连架杆和机架中必有一个是最短杆。","曲柄不一定是最短杆。当最短杆为连架杆时，该杆为曲柄；但当最短杆为机架时（此时也满足曲柄存在的条件），两个连架杆都能整周回转、均为曲柄，而最短杆本身是机架而不是曲柄。因此“有曲柄”的条件是最短杆为连架杆或机架，曲柄不一定是（也常常不是）最短杆。"],"img":null,"tags":["四杆机构"]},{"id":"s6","n":6,"type":"short","q":"凸轮机构中，选择基圆半径时要考虑哪些因素？选择原则是什么？","ans":["考虑因素：①压力角——基圆半径越小，压力角越大，传力性能越差；②凸轮轴及机构的尺寸、安装空间（希望结构紧凑）；③滚子半径与实际轮廓最小曲率半径（避免轮廓变尖或运动失真）；④凸轮与轴的连接及强度。","选择原则：在保证不产生运动失真、且最大压力角不超过许用值（移动从动件 [α]≤30°，摆动从动件 [α]≤45°）的前提下，尽量取较小的基圆半径，使结构紧凑；同时保证实际轮廓最小曲率半径 ρa≥3~5 mm。"],"img":null,"tags":["凸轮机构"]},{"id":"s7","n":7,"type":"short","q":"提高螺栓连接强度的措施有哪些？","ans":["①改善螺纹牙间载荷分配：采用悬置螺母、内斜螺母、环槽螺母或钢丝螺套，使各圈螺纹受力均匀；","②减小螺栓的应力幅：减小螺栓刚度（如采用空心螺栓、细长螺栓）、增大被联接件刚度（如加厚法兰、加垫片），以减小螺栓的应力幅；","③避免附加弯曲应力：保证被联接件支承面平整、垂直于螺栓轴线，采用凸台、沉孔、斜垫圈等；","④减小应力集中：增大螺纹牙底圆角、采用退刀槽、增大过渡圆角、合理过渡；","⑤采用合理的制造工艺：冷镦、滚压螺纹（使螺纹表层产生残余压应力）、表面热处理。"],"img":null,"tags":["连接"]},{"id":"s8","n":8,"type":"short","q":"链传动的可能失效形式有哪些？","ans":["①链条元件的疲劳破坏：链板疲劳断裂、滚子与套筒的疲劳点蚀（闭式链传动的主要失效形式）；","②链条铰链的磨损：链节伸长，引起跳齿、脱链（开式、润滑不良时的主要失效形式）；","③链条铰链的胶合：高速重载时销轴与套筒间油膜破坏、金属直接接触而胶合；","④链条静强度破坏：低速重载或过载时链条被拉断；","⑤链轮轮齿的磨损。"],"img":null,"tags":["带链传动"]},{"id":"s9","n":9,"type":"short","q":"何谓链传动的多边形效应？如何减轻多边形效应的影响？","ans":["多边形效应：链条绕在链轮上时，各链节在链轮上形成正多边形而不是圆，链条沿轮齿的瞬时速度（及瞬时传动比）随链轮转角作周期性变化，同时链条有上下颤动，从而产生附加动载荷和振动，这种现象称多边形效应。","减轻措施：①增大链轮齿数 z<sub>1<\/sub>（最有效）；②在满足强度条件下尽量选小链节距 p；③限制链轮的转速；④采用张紧装置、减振装置；⑤提高制造和安装精度、保证良好润滑。"],"img":null,"tags":["带链传动"]},{"id":"s10","n":10,"type":"short","q":"提高螺栓连接强度的措施有哪些？这些措施中哪些主要是针对静强度？哪些主要是针对疲劳强度？","ans":["（措施同第7题）①改善螺纹牙间载荷分配；②减小螺栓应力幅（减小螺栓刚度、增大被联接件刚度）；③避免附加弯曲应力；④减小应力集中；⑤合理工艺（滚压螺纹、热处理等）。","主要针对静强度的措施：采用高强度材料、增大螺栓直径、避免附加弯曲应力、提高支承面刚度。","主要针对疲劳强度的措施：减小螺栓的应力幅（减小螺栓刚度、增大被联接件刚度）、改善螺纹牙间载荷分配（悬置螺母、内斜螺母等）、减小应力集中——包括增大螺纹根部圆角、采用退刀槽与合理过渡、滚压螺纹使表层产生残余压应力。"],"img":null,"tags":["连接"]},{"id":"s11","n":11,"type":"short","q":"如图所示，设已知四杆机构各构件的长度为 a=240mm，b=600mm，c=400mm，d=500mm。试问取杆4（d）为机架时，是否有曲柄存在？该四杆机构为何种机构？","ans":["判定：最短杆 a=240，最长杆 b=600。","a+b = 240+600 = 840 ≤ c+d = 400+500 = 900，满足格拉肖夫条件（杆长之和条件）；","又最短杆 a（杆1，AB）与机架 d（杆4，AD）相邻，故最短杆为连架杆——AB 为曲柄。","结论：有曲柄存在，AB（杆1）为曲柄、CD（杆3）为摇杆，该机构为曲柄摇杆机构。"],"img":"s11","tags":["四杆机构"]}],"analysis":[{"id":"a1","n":1,"type":"analysis","q":"在下图的轴系中存在结构错误，在空白处按序号简要说明错误内容，不必在图上改正。","given":"","intro":"该轴左端装皮带轮、中部装齿轮、两端各一个深沟球轴承，端盖固定在箱体上。按“轴端—皮带轮定位—周向固定—端盖密封—垫片与加工面—轴承内圈—齿轮轴向—齿轮周向”的顺序逐项检查。","img":"an1","ansImg":null,"items":[["①","轴端未短于皮带轮左端面（无轴端挡圈；轴端无倒角）","轴端应倒角，并比轮毂端面缩进 2~3 mm；或加轴端挡圈"],["②","皮带轮右端未轴向定位","设轴肩、套筒或挡圈，使皮带轮双向轴向定位"],["③","皮带轮没有周向定位","加工键槽、装平键（或花键），实现周向固定"],["④","端盖轴孔处未密封；端盖轴孔与轴之间无间隙","端盖孔与轴留出间隙，并装密封件（毡圈或唇形密封圈）"],["⑤","端盖与箱体接合面无调整垫片；箱体外壁加工面与非加工面未分开","加调整垫片调整轴承游隙；加工面与非加工面分开"],["⑥","轴承内圈没有定位","用轴肩或套筒定位内圈，轴肩高度应小于内圈厚度"],["⑦","齿轮左右端面无轴向定位；与轮毂配合的轴段长度等于轮毂宽度","设轴肩/套筒定位，轴段长度比轮毂宽度短 2~3 mm"],["⑧","齿轮没有周向定位","加工键槽、装平键，实现周向固定"]],"steps":[],"table":[],"result":"","notes":["【说明】按老师作业答案的 8 处给分点整理；同一序号答出其中任意一项即可。"],"tags":["轴系结构"]},{"id":"a2","n":2,"type":"analysis","q":"在下图的轴系中存在结构错误，在空白处按序号简要说明错误内容（不少于8处），不必在图上改正。","given":"","intro":"该轴左端外伸装半联轴器、中部装齿轮、两端各一个深沟球轴承，端盖固定在箱体上。按“联轴器—套筒—齿轮—轴肩—箱体加工面—垫片”的顺序逐项检查。","img":"an2","ansImg":null,"items":[["①","联轴器左端无轴端挡圈","加轴端挡圈，对半联轴器作左端轴向固定"],["②","联轴器无周向固定（缺键）","加工键槽、装平键，实现周向固定"],["③","联轴器右端无轴向固定（缺少轴肩）","在联轴器右侧设定位轴肩"],["④","套筒过高（外径超过轴承内圈）","降低套筒外径，使其低于轴承内圈外径"],["⑤","轴头长度等于轮毂宽度，定位不可靠","轴段长度比轮毂宽度短 2~3 mm"],["⑥","齿轮无周向固定（缺键）","加工键槽、装平键，实现周向固定"],["⑦","定位轴肩过高","降低轴肩高度（小于内圈厚度），便于拆卸"],["⑧","箱体外壁加工面与非加工面没分开","将加工面与非加工面分开"],["⑨","缺调整垫片","在端盖与箱体结合面加调整垫片，调整轴承游隙"]],"steps":[],"table":[],"result":"","notes":["【说明】按老师作业答案的 9 处给分点整理；答题时任选 8 处以上即可。"],"tags":["轴系结构"]},{"id":"a3","n":3,"type":"analysis","q":"在下图轴系中，齿轮采用油润滑，轴承采用脂润滑。试分析轴系结构的错误，说明图中序号的结构错误。","given":"","intro":"本题为两端都是闷盖的中间轴：齿轮用油润滑、轴承用脂润滑。按“轴颈长度—端盖垫片—齿轮轴向定位—套筒/轴环—键—轴承内圈高度—加工面”的顺序逐项检查。","img":"an3","ansImg":null,"items":[["1","轴的两端轴颈过长，与端盖接触严重磨损，浪费材料、装拆麻烦","缩短轴颈，使轴端与端盖内壁留出间隙"],["2","两侧轴承端盖处没有调整垫片，不能调整轴承游隙和轴系的轴向位置","在端盖与箱体结合面加调整垫片"],["3","齿轮没有轴向定位，未将齿轮上的轴向力传到机座，应将轴承改为正装","设轴肩/套筒对齿轮轴向定位；轴承改为正装"],["4","两齿轮的轮毂长度与轴头相等，齿轮轴向定位不可靠","轴段长度比轮毂宽度短 2~3 mm"],["5","两个齿轮间用套筒定位，不能固定齿轮与轴的相对位置，应改为轴环","改用轴环（或轴肩）定位"],["6","两个齿轮不能共用一个键，而且键过长，三个套不能装配","两齿轮分别设键，键长略短于各自轮毂宽度"],["7","两轴承的内圈高度低于套筒，轴承拆卸困难","降低套筒外径/高度，保证轴承内圈可拆卸"],["8","轴承端盖加工面与非加工面应分开","将端盖加工面与非加工面分开"]],"steps":[],"table":[],"result":"","notes":["【说明】按老师作业答案的 8 处结构错误整理；图中序号与答案一一对应。【补充】齿轮油润滑、轴承脂润滑，轴承靠箱体内侧宜设挡油环（甩油环）+密封圈；老师答案的 8 个给分点未单列此项。"],"tags":["轴系结构"]},{"id":"a4","n":4,"type":"analysis","q":"在图示锥齿轮—斜齿轮—蜗杆蜗轮传动系统中，轮1为主动轮，转向如图所示，为使Ⅱ轴和Ⅲ轴所受轴向力能抵消一部分，试在图上：1）标出各轴的转向；2）标出各轮上轴向力的作用位置和方向；3）标出斜齿轮3和4的螺旋线方向。","given":"轮1为主动轮，n<sub>1<\/sub> 如图（自轴Ⅰ上端俯视为逆时针）；要求使Ⅱ轴、Ⅲ轴的轴向力能抵消一部分。","intro":"","img":"an4","ansImg":"a4","items":[],"steps":[["① 各轴转向","轴Ⅰ（锥齿轮1）：按图示 n<sub>1<\/sub>，从轴Ⅰ上端俯视为逆时针。<br>锥齿轮1、2啮合：啮合点两轮速度相同，得轴Ⅱ的转向为“从右端看顺时针”。<br>斜齿轮3、4为外啮合：轴Ⅲ与轴Ⅱ转向相反，即“从右端看逆时针”。<br>蜗杆5（在轴Ⅲ上）→ 蜗轮6（轴Ⅳ）：按蜗杆传动的左右手法则判定，蜗轮6在图面内作逆时针转动。"],["② 锥齿轮的轴向力","锥齿轮的轴向力总是由小端指向大端（背离锥顶）：<br>轮1大端朝上 → Fa<sub>1<\/sub> 向上；<br>轮2大端朝右 → Fa<sub>2<\/sub> 向右。"],["③ 由Ⅱ轴“轴向力抵消”定斜齿轮3的旋向","要抵消 Fa<sub>2<\/sub>，齿轮3的轴向力必须反向，即 Fa<sub>3<\/sub> 向左。<br>齿轮3为主动轮，转向与轴Ⅱ相同（从右端看顺时针）。按左右手法则：主动轮右旋用右手、左旋用左手，四指沿转向弯曲，拇指即轴向力方向。要得到向左的 Fa<sub>3<\/sub>，齿轮3必须为右旋。"],["④ 斜齿轮4的旋向","平行轴外啮合的一对斜齿轮旋向必定相反 → 齿轮4为左旋；外啮合两轮轴向力方向也必定相反 → Fa<sub>4<\/sub> 向右。"],["⑤ 由Ⅲ轴“轴向力抵消”定蜗杆5的旋向","Ⅲ轴上 Fa<sub>4<\/sub> 向右，要抵消它，蜗杆5的轴向力 Fa<sub>5<\/sub> 应向左。<br>蜗杆5为主动件（转向与轴Ⅲ相同，从右端看逆时针），按蜗杆左右手法则：要得到向左的 Fa<sub>5<\/sub>，蜗杆5应为左旋。"],["⑥ 蜗轮6的轴向力","蜗轮6的轴向力 Fa<sub>6<\/sub> = Ft<sub>5<\/sub>（蜗杆的圆周力），方向垂直于纸面指向读者，记作 ⊙。"]],"table":[["轴Ⅰ（锥齿轮1）","俯视逆时针（给定）","Fa<sub>1<\/sub> 向上（↑）"],["轴Ⅱ（锥齿轮2、斜齿轮3）","从右端看顺时针","Fa<sub>2<\/sub> 向右（→）、Fa<sub>3<\/sub> 向左（←），互相抵消"],["轴Ⅲ（斜齿轮4、蜗杆5）","从右端看逆时针","Fa<sub>4<\/sub> 向右（→）、Fa<sub>5<\/sub> 向左（←），互相抵消"],["轴Ⅳ（蜗轮6）","图面内逆时针","Fa<sub>6<\/sub> 垂直纸面向外（⊙）"]],"result":"斜齿轮3为右旋（水平轴正面画“\\”），斜齿轮4为左旋（正面画“/”）；蜗杆5为左旋。各轮轴向力见答案图与上表。","notes":["判断要点：锥齿轮——由小端指向大端；斜齿轮——主动轮右旋用右手、左旋用左手（四指沿转向，拇指为轴向力方向）；蜗杆——主动蜗杆右旋用右手、左旋用左手，四指沿蜗杆转向，拇指指向主动蜗杆所受轴向力 Fa<sub>1<\/sub> 的方向；蜗轮在啮合点的圆周速度 v<sub>2<\/sub>（即 Ft<sub>2<\/sub>）与 Fa<sub>1<\/sub> 方向相反。","若题给 n<sub>1<\/sub> 反向，则各轴转向、各轴向力方向全部反向，斜齿轮3、4的旋向也随之对调（3左旋、4右旋）。"],"tags":["受力旋向"]},{"id":"a5","n":5,"type":"analysis","q":"在图示蜗杆蜗轮—斜齿轮—锥齿轮传动系统中，齿轮6的转向如图所示，蜗杆为主动件，为使Ⅱ和Ⅲ轴所受轴向力能抵消一部分，试在图上：1）标出各轴的转向；2）标出各轮上轴向力的作用位置和方向；3）标出斜齿轮3和4的螺旋线方向。","given":"齿轮6的转向 n<sub>6<\/sub> 如图；蜗杆为主动件。按图示划分：蜗杆1（轴Ⅰ，轴线垂直于纸面）为主动件，蜗轮2与斜齿轮3同在轴Ⅱ上，斜齿轮4与锥齿轮5同在轴Ⅲ上，锥齿轮6在轴Ⅳ上。","intro":"","img":"an5","ansImg":"a5","items":[],"steps":[["① 传动路线","蜗杆1（主动）→ 蜗轮2（轴Ⅱ）→ 斜齿轮3（轴Ⅱ）→ 斜齿轮4（轴Ⅲ）→ 锥齿轮5（轴Ⅲ）→ 锥齿轮6（轴Ⅳ，输出）。<br>轴Ⅱ、轴Ⅲ上各装两个传动件，故都能利用轴向力互相抵消一部分。"],["② 各轴转向","轴Ⅳ：n<sub>6<\/sub> 给定，俯视逆时针；<br>轴Ⅲ：由锥齿轮5、6的啮合关系定出，从右端看顺时针；<br>轴Ⅱ：斜齿轮4、3外啮合，与轴Ⅲ转向相反，从右端看逆时针；<br>轴Ⅰ：由蜗轮2（轴Ⅱ）的转向和蜗杆1的旋向按蜗杆传动左右手法则定出，蜗杆1在图面内逆时针转动。"],["③ 各轮轴向力","蜗杆1：Fa<sub>1<\/sub> 垂直于纸面向里（⊗）——主动蜗杆右旋用右手、左旋用左手，四指沿转向，拇指为 Fa<sub>1<\/sub> 的方向；<br>蜗轮2：Fa<sub>2<\/sub> = Ft<sub>1<\/sub>，与 Fa<sub>1<\/sub> 垂直（Fa<sub>1<\/sub> 与 Ft<sub>2<\/sub> 是作用力与反作用力，蜗轮在啮合点的 v<sub>2<\/sub> 与 Fa<sub>1<\/sub> 反向）；<br>斜齿轮3、4（外啮合）：轴向力大小相等、方向相反，即 Fa<sub>3<\/sub> 与 Fa<sub>4<\/sub> 反向；<br>锥齿轮5、6：两轮轴向力均由小端指向大端。"],["④ 由“轴向力抵消”确定旋向与方向","蜗轮2的正面齿线为“/”，由正面齿线可判定蜗轮2为左旋，因而蜗杆1同为左旋；<br>Ⅱ轴：Fa<sub>2<\/sub> 向右、Fa<sub>3<\/sub> 向左 → 斜齿轮3取左旋（水平轴正面画“/”）；<br>Ⅲ轴：Fa<sub>4<\/sub> 向右、Fa<sub>5<\/sub> 向左 → 斜齿轮4取右旋（水平轴正面画“\\”），与齿轮3旋向相反（外啮合）✓。"]],"table":[["轴Ⅰ（蜗杆1）","图面内逆时针","Fa<sub>1<\/sub> 垂直纸面向里（⊗）；蜗杆1左旋"],["轴Ⅱ（蜗轮2、斜齿轮3）","从右端看逆时针","Fa<sub>2<\/sub> 向右（→）、Fa<sub>3<\/sub> 向左（←），互相抵消；蜗轮2左旋、齿轮3左旋"],["轴Ⅲ（斜齿轮4、锥齿轮5）","从右端看顺时针","Fa<sub>4<\/sub> 向右（→）、Fa<sub>5<\/sub> 向左（←），互相抵消；齿轮4右旋"],["轴Ⅳ（锥齿轮6）","俯视逆时针（给定 n<sub>6<\/sub>）","Fa<sub>6<\/sub> 向下（↓）"]],"result":"蜗杆1左旋、蜗轮2左旋；斜齿轮3左旋（正面画“/”）、斜齿轮4右旋（正面画“\\”）；Fa<sub>1<\/sub>⊗、Fa<sub>2<\/sub>→、Fa<sub>3<\/sub>←、Fa<sub>4<\/sub>→、Fa<sub>5<\/sub>←、Fa<sub>6<\/sub>↓。","notes":["锥齿轮副：两轮轴向力均由小端指向大端。","斜齿轮副（外啮合）：两轮旋向相反、轴向力方向相反。","蜗杆副：Fa<sub>1<\/sub>=Ft<sub>2<\/sub>、Fa<sub>2<\/sub>=Ft<sub>1<\/sub>；主动蜗杆的轴向力用左右手法则判定，蜗轮啮合点的圆周速度与 Fa<sub>1<\/sub> 反向。"],"tags":["受力旋向"]},{"id":"a6","n":6,"type":"analysis","q":"如图所示为一起重装置，欲使重物上升，已知蜗杆右旋，试在图上：（1）标出各轮的转向；（2）为了使中间轴所受轴向力能抵消一部分，在图上标出斜齿轮1、2的螺旋线方向；（3）标出各轮上轴向力的作用位置和方向。","given":"电机经齿轮1、2（斜齿轮副）→ 中间轴上的锥齿轮2′ → 锥齿轮3 → 蜗杆3′（右旋）→ 蜗轮4（卷筒）→ 重物。欲使重物上升。","intro":"","img":"an6","ansImg":"a6","items":[],"steps":[["① 卷筒（蜗轮4）的转向","重物上升要求卷筒把钢丝绳卷起，卷筒与绳相切的一侧向上运动，故蜗轮4（卷筒）在图面内作逆时针转动。"],["② 蜗杆3′与轴Ⅲ的转向","蜗轮4在图面内逆时针，蜗杆3′在其上方（啮合点在轮顶）。蜗杆3′为主动件且为右旋：<br>主动蜗杆右旋用右手、四指沿蜗杆转向，拇指指向蜗杆所受轴向力 Fa<sub>3′<\/sub>；蜗轮啮合点的圆周速度与 Fa<sub>3′<\/sub> 反向。<br>由 Fa<sub>3′<\/sub> 向右可知蜗杆3′、轴Ⅲ（及锥齿轮3）的转向为：从右端看逆时针。"],["③ 中间轴与电机轴的转向","锥齿轮3（轴Ⅲ）与锥齿轮2′（中间轴）啮合：由3的转向及锥面啮合关系得中间轴（齿轮2、2′）从上方俯视顺时针转动；<br>齿轮2与齿轮1外啮合，故齿轮1（电机轴）从上方俯视逆时针转动。"],["④ 由“中间轴轴向力抵消”确定斜齿轮1、2的旋向","锥齿轮2′的大端朝下 → Fa<sub>2′<\/sub> 向下（由小端指向大端）。<br>要抵消 Fa<sub>2′<\/sub>，斜齿轮2的轴向力 Fa<sub>2<\/sub> 必须向上。<br>齿轮1为主动轮（俯视逆时针）：按左右手法则，要使其轴向力 Fa<sub>1<\/sub> 向下（与 Fa<sub>2<\/sub> 相反），齿轮1应取左旋；<br>平行轴外啮合两轮旋向相反 → 齿轮2取右旋，Fa<sub>2<\/sub> 向上，与 Fa<sub>2′<\/sub> 抵消。"],["⑤ 其余各轮轴向力","锥齿轮3大端朝左 → Fa<sub>3<\/sub> 向左；蜗杆3′为 Fa<sub>3′<\/sub> 向右（与 Fa<sub>3<\/sub> 反向，抵消Ⅲ轴的一部分轴向力）；<br>蜗轮4的轴向力 Fa<sub>4<\/sub> = Ft<sub>3′<\/sub>，方向垂直于纸面向里，记作 ⊗。"]],"table":[["电机轴（斜齿轮1）","俯视逆时针","Fa<sub>1<\/sub> 向下（↓）；齿轮1左旋（竖直轴正面画“\\”）"],["中间轴（斜齿轮2、锥齿轮2′）","俯视顺时针","Fa<sub>2<\/sub> 向上（↑）、Fa<sub>2′<\/sub> 向下（↓），互相抵消；齿轮2右旋（竖直轴正面画“/”）"],["轴Ⅲ（锥齿轮3、蜗杆3′）","从右端看逆时针","Fa<sub>3<\/sub> 向左（←）、Fa<sub>3′<\/sub> 向右（→），互相抵消"],["卷筒轴（蜗轮4）","图面内逆时针","Fa<sub>4<\/sub> 垂直纸面向里（⊗）；蜗轮4右旋"]],"result":"斜齿轮1为左旋（正面画“\\”）、斜齿轮2为右旋（正面画“/”）；Fa<sub>1<\/sub>↓、Fa<sub>2<\/sub>↑、Fa<sub>2′<\/sub>↓、Fa<sub>3<\/sub>←、Fa<sub>3′<\/sub>→、Fa<sub>4<\/sub>⊗；卷筒逆时针转动使重物上升。","notes":["蜗杆3′为右旋（题给）；若蜗杆改为左旋，则轴Ⅲ、中间轴、电机轴的转向全部反向。","锥齿轮的轴向力始终由小端指向大端（背离锥顶）。","竖直轴上的斜齿轮画法：右旋画“/”、左旋画“\\”；水平轴上的斜齿轮画法：右旋画“\\”、左旋画“/”。"],"tags":["受力旋向"]}],"calc":[{"id":"c1","n":1,"type":"calc","q":"如图所示，已知 DE=FG=HI 且相互平行，试计算机构的自由度，并判断其是否具有确定运动。","given":"DE=FG=HI 且相互平行；凸轮1为原动件。","img":"c1","steps":[["① 处理虚约束","DE、FG、HI 三杆平行且等长，其中 HI 为机架，所以 DE、FG 两根平行杆中有一根是多余约束（虚约束）。计算时把 FG 杆（连同 F、G 两个转动副）去掉，机架与构件 D-F-H、E-G-I 之间的相对运动不受影响。"],["② 处理局部自由度","滚子绕自身轴线的转动不影响输出运动，属局部自由度。去掉后把滚子与摆杆2视为一个构件，凸轮与摆杆之间为高副。"],["③ 数构件数 n","凸轮1、摆杆2（含滚子）、杆3、杆4、杆5（D-F-H，固定在H）、杆7（E-G-I，固定在I）、杆8、滑块9，共 n=8 个活动构件。"],["④ 数运动副","低副 P<sub>L<\/sub>：机架A处1个；B处（摆杆2与杆3）1个；C处1个；D处3个构件（杆3、杆4、杆5）构成复合铰链→2个；E处3个构件（杆4、杆7、杆8）构成复合铰链→2个；H处1个；I处1个；K处1个；滑块9与机架1个。合计 P<sub>L<\/sub>=1+1+1+2+2+1+1+1+1=11。高副 P<sub>H<\/sub>=1（凸轮与滚子）。"],["⑤ 计算自由度","F = 3n − 2P<sub>L<\/sub> − P<sub>H<\/sub> = 3×8 − 2×11 − 1 = 24 − 22 − 1 = 1"],["⑥ 判断","原动件只有凸轮1个，F=原动件数=1，所以机构具有确定的相对运动。"]],"result":"F = 1，机构具有确定运动。","notes":["虚约束：DE、FG 中任取一根为多余约束（本解去掉 FG）：共1处。","局部自由度：滚子绕自身轴线的转动，共1处。","复合铰链：D处（3个构件）、E处（3个构件），各含2个转动副。"],"module":"dof","tags":["机构组成"]},{"id":"c2","n":2,"type":"calc","q":"计算图示机构的自由度，并判断其是否具有确定运动。","given":"凸轮1为原动件；滚子2、摆杆B-C-D（C为固定铰链）、导杆D-F、固定竖直导轨E、杆F-H、杆H-G（G为固定铰链）。图中E为固定导轨，导杆在其间滑动（不是活动滑块）。","img":"c2","steps":[["① 处理局部自由度","滚子绕自身轴线的转动为局部自由度，去掉后把滚子与摆杆B-C-D合并为一个构件，凸轮与摆杆之间为高副。"],["② 数构件数 n","凸轮1、摆杆B-C-D（含滚子）、导杆D-F、杆F-H、杆H-G，共 n=5 个活动构件。"],["③ 数运动副","低副 P<sub>L<\/sub>=7：凸轮与机架（A处）1个；摆杆与机架（C处）1个；摆杆与导杆（D处）1个；导杆与杆F-H（F处）1个；杆F-H与杆H-G（H处）1个；杆H-G与机架（G处）1个；导杆在固定导轨E中滑动——1个移动副。高副 P<sub>H<\/sub>=1（凸轮与滚子）。"],["④ 计算自由度","F = 3n − 2P<sub>L<\/sub> − P<sub>H<\/sub> = 3×5 − 2×7 − 1 = 15 − 14 − 1 = 0"],["⑤ 判断","F=0，说明该组合体不能运动，是一个桁架（刚性结构），不具有确定的相对运动。原因：导杆被固定导轨约束只能沿竖直方向移动，而摆杆上的D点只能绕C作圆周运动，两者不可能同时满足，机构被“锁死”。原动件为凸轮，但机构无法运动。"]],"result":"F = 0，该组合体为桁架（不能运动），不具有确定的相对运动。","notes":["【提醒】若原卷插图中E处画的是“滑块（与导杆铰接）+导轨”，则该处为“转动副+移动副”两个低副，此时 n=6、P<sub>L<\/sub>=8，F=3×6−2×8−1=1，机构可动。请核对原卷插图是否有漏画滑块/铰链。","局部自由度：滚子（1处）；复合铰链：无。"],"module":"dof","tags":["机构组成"]},{"id":"c3","n":3,"type":"calc","q":"计算图示机构的自由度（若存在局部自由度、复合铰链、虚约束，请明确指出）。","given":"曲柄A-B为原动件；连杆B-C；滑块D（带凸轮形轮廓，由导轨支承）；滚子F与滑块D组成高副；摆杆H-G、杆F-I、滑块J。","img":"c3","steps":[["① 局部自由度","滚子绕自身轴线转动不影响输出运动，是局部自由度。把滚子与三角板G-F-I合并，滑块D的轮廓与滚子之间为高副。"],["② 虚约束","滑块D由机架的导轨支承、只作水平移动，两条导轨属于同一移动副的重复约束，计算时只算一个移动副。"],["③ 数构件数 n","曲柄A-B、连杆B-C、滑块D、三角板G-F-I（含滚子）、摆杆H-G、滑块J，共 n=6 个活动构件。"],["④ 数运动副","低副 P<sub>L<\/sub>=8：A处1个；B处1个；C处1个；滑块D与机架（移动副）1个；三角板与杆H-G（G处）1个；杆H-G与机架（H处）1个；三角板与滑块J（I处）1个；滑块J与机架（移动副）1个。高副 P<sub>H<\/sub>=1（滑块D与滚子F）。"],["⑤ 计算自由度","F = 3n − 2P<sub>L<\/sub> − P<sub>H<\/sub> = 3×6 − 2×8 − 1 = 18 − 16 − 1 = 1"],["⑥ 判断","原动件为曲柄A-B（1个），F=1=原动件数，故机构具有确定的相对运动。"]],"result":"F = 1，机构具有确定运动。","notes":["局部自由度：滚子（1处）。","虚约束：滑块D的两条导轨中有一条属重复约束（1处）。","复合铰链：无（三角板G-F-I按一个刚性构件计）。"],"module":"dof","tags":["机构组成"]},{"id":"c4","n":4,"type":"calc","q":"计算图示机构的自由度，并判断其是否具有确定运动。","given":"凸轮（O为固定轴心）与水平滑块上的滚子F组成高副；曲柄A-B与凸轮（轴心O）为两个原动件。","img":"c4","steps":[["① 局部自由度","滚子F绕自身轴线转动为局部自由度，去掉后把滚子与水平滑块合并，凸轮与滑块之间为高副。"],["② 虚约束","水平滑块由两端导轨重复支承，其中一处为虚约束，计算时只算一个移动副。"],["③ 数构件数 n","凸轮1、水平滑块（含滚子）、杆C-D、杆B-C、曲柄A-B、杆C-G、滑块G，共 n=7 个活动构件。"],["④ 数运动副","低副 P<sub>L<\/sub>=9：凸轮与机架1个；水平滑块与机架（移动副）1个；D处1个；C处（杆C-D、杆B-C、杆C-G三个构件）复合铰链2个；B处1个；A处1个；G处1个；滑块G与机架（移动副）1个。高副 P<sub>H<\/sub>=1（凸轮与滚子）。"],["⑤ 计算自由度","F = 3n − 2P<sub>L<\/sub> − P<sub>H<\/sub> = 3×7 − 2×9 − 1 = 21 − 18 − 1 = 2"],["⑥ 判断","F=2，需要两个原动件。题图中凸轮（O处）与曲柄A-B都标出了转向，恰为两个原动件，故机构具有确定的相对运动。"]],"result":"F = 2，需两个原动件；图中凸轮与曲柄A-B均为原动件时具有确定运动。","notes":["局部自由度：滚子（1处）。虚约束：水平滑块导轨的重复支承（1处）。复合铰链：C处（3个构件）。"],"module":"dof","tags":["机构组成"]},{"id":"c5","n":5,"type":"calc","q":"一对外啮合的渐开线标准直齿圆柱齿轮传动（正常齿制），已知传动比 i<sub>12<\/sub>=2.5，现测得小齿轮齿数 z<sub>1<\/sub>=26、齿顶圆直径 da<sub>1<\/sub>=140 mm，齿顶高系数 ha*=1、顶隙系数 c*=0.25。试计算：（1）这对齿轮的模数 m；（2）大齿轮齿数 z<sub>2<\/sub>、分度圆直径 d<sub>2<\/sub>、齿顶圆直径 da<sub>2<\/sub> 及齿根圆直径 df<sub>2<\/sub>；（3）标准中心距 a。","given":"外啮合标准直齿圆柱齿轮，正常齿制：i<sub>12<\/sub>=2.5，z<sub>1<\/sub>=26，da<sub>1<\/sub>=140 mm，ha*=1，c*=0.25。","img":null,"steps":[["（1）模数 m","齿顶圆直径 da<sub>1<\/sub> = m(z<sub>1<\/sub> + 2ha*) = m(26+2) = 28m<br>由 28m = 140 得 m = 5 mm"],["（2）大齿轮参数","z<sub>2<\/sub> = i<sub>12<\/sub>·z<sub>1<\/sub> = 2.5×26 = 65<br>d<sub>2<\/sub> = m·z<sub>2<\/sub> = 5×65 = 325 mm<br>da<sub>2<\/sub> = m(z<sub>2<\/sub> + 2ha*) = 5×(65+2) = 335 mm<br>df<sub>2<\/sub> = m(z<sub>2<\/sub> − 2ha* − 2c*) = 5×(65−2.5) = 312.5 mm"],["（3）标准中心距","a = m(z<sub>1<\/sub> + z<sub>2<\/sub>)/2 = 5×(26+65)/2 = 5×91/2 = 227.5 mm"]],"result":"m=5 mm；z<sub>2<\/sub>=65，d<sub>2<\/sub>=325 mm，da<sub>2<\/sub>=335 mm，df<sub>2<\/sub>=312.5 mm；a=227.5 mm。","notes":["正常齿制：ha*=1，c*=0.25，故 df = m(z − 2.5)。"],"module":"gear","tags":["齿轮几何"]},{"id":"c6","n":6,"type":"calc","q":"二级齿轮减速器有一对外啮合渐开线标准直齿圆柱齿轮（正常齿制），已知小齿轮齿数 z<sub>1<\/sub>=28、齿顶圆直径 da<sub>1<\/sub>=150 mm、中心距 a=250 mm，ha*=1、c*=0.25。试计算这对齿轮的模数、传动比及大齿轮的齿数、分度圆直径、齿顶圆直径、齿根圆直径和全齿高。","given":"二级齿轮减速器中的一对外啮合标准直齿圆柱齿轮，正常齿制：z<sub>1<\/sub>=28，da<sub>1<\/sub>=150 mm，a=250 mm，ha*=1，c*=0.25。","img":null,"steps":[["（1）模数 m","da<sub>1<\/sub> = m(z<sub>1<\/sub>+2) = 30m = 150 ⇒ m = 5 mm"],["（2）大齿轮齿数与传动比","a = m(z<sub>1<\/sub>+z<sub>2<\/sub>)/2 ⇒ 250 = 5(28+z<sub>2<\/sub>)/2 ⇒ 28+z<sub>2<\/sub> = 100 ⇒ z<sub>2<\/sub> = 72<br>i = z<sub>2<\/sub>/z<sub>1<\/sub> = 72/28 = 2.571"],["（3）各几何尺寸","d<sub>2<\/sub> = m·z<sub>2<\/sub> = 5×72 = 360 mm<br>da<sub>2<\/sub> = m(z<sub>2<\/sub>+2) = 5×74 = 370 mm<br>df<sub>2<\/sub> = m(z<sub>2<\/sub>−2.5) = 5×69.5 = 347.5 mm<br>全齿高 h = (2ha*+c*)m = 2.25m = 2.25×5 = 11.25 mm"]],"result":"m=5 mm；z<sub>2<\/sub>=72，i=2.571；d<sub>2<\/sub>=360 mm，da<sub>2<\/sub>=370 mm，df<sub>2<\/sub>=347.5 mm，h=11.25 mm。","notes":["校核：d<sub>1<\/sub> = m·z<sub>1<\/sub> = 140 mm，d<sub>1<\/sub>+d<sub>2<\/sub> = 140+360 = 500 = 2a ✓。"],"module":"gear","tags":["齿轮几何"]},{"id":"c7","n":7,"type":"calc","q":"现需要一对渐开线标准直齿圆柱齿轮外啮合传动。现有三个标准齿轮，齿数 z<sub>1<\/sub>=30、z<sub>2<\/sub>=z<sub>3<\/sub>=50，齿顶圆直径 da<sub>1<\/sub>=96 mm、da<sub>2<\/sub>=156 mm、da<sub>3<\/sub>=143 mm，ha*=1、c*=0.25。试计算：（1）哪两个齿轮能正确啮合？（2）小齿轮分度圆直径 d<sub>1<\/sub>、齿根圆直径 df<sub>1<\/sub> 及齿高 h<sub>1<\/sub>；（3）这对齿轮的标准中心距 a。","given":"三个标准直齿圆柱齿轮：z<sub>1<\/sub>=30，z<sub>2<\/sub>=z<sub>3<\/sub>=50；da<sub>1<\/sub>=96 mm，da<sub>2<\/sub>=156 mm，da<sub>3<\/sub>=143 mm；ha*=1，c*=0.25。","img":null,"steps":[["（1）判断正确啮合","由 da = m(z+2) 反求各轮模数：<br>m<sub>1<\/sub> = da<sub>1<\/sub>/(z<sub>1<\/sub>+2) = 96/32 = 3 mm<br>m<sub>2<\/sub> = da<sub>2<\/sub>/(z<sub>2<\/sub>+2) = 156/52 = 3 mm<br>m<sub>3<\/sub> = da<sub>3<\/sub>/(z<sub>3<\/sub>+2) = 143/52 = 2.75 mm<br>齿轮1与齿轮2的模数相等（均为3 mm）、压力角均为20°，故齿轮1和齿轮2能正确啮合；齿轮3的模数为2.75 mm，与1、2均不相等，不能正确啮合。"],["（2）小齿轮（z<sub>1<\/sub>=30）的尺寸","d<sub>1<\/sub> = m·z<sub>1<\/sub> = 3×30 = 90 mm<br>df<sub>1<\/sub> = m(z<sub>1<\/sub>−2.5) = 3×27.5 = 82.5 mm<br>齿高 h<sub>1<\/sub> = 2.25m = 2.25×3 = 6.75 mm"],["（3）标准中心距","a = m(z<sub>1<\/sub>+z<sub>2<\/sub>)/2 = 3×(30+50)/2 = 3×40 = 120 mm"]],"result":"（1）齿轮1与齿轮2能正确啮合；（2）d<sub>1<\/sub>=90 mm，df<sub>1<\/sub>=82.5 mm，h<sub>1<\/sub>=6.75 mm；（3）a=120 mm。","notes":["da<sub>1<\/sub> 与 da<sub>2<\/sub> 对应 m=3，说明 1、2 是同模数齿轮；da<sub>3<\/sub> 对应 m=2.75，故 3 不能与前两者啮合。"],"module":"gear","tags":["齿轮几何"]},{"id":"c8","n":8,"type":"calc","q":"在如图所示的轮系中，各齿轮均为标准齿轮，已知 z<sub>1<\/sub>=34、z<sub>2<\/sub>=22、z<sub>3<\/sub>=78、z<sub>4<\/sub>=18、z<sub>5<\/sub>=35、z<sub>6<\/sub>=88，两齿圈 3、6 固定。计算传动比 i<sub>1H2<\/sub>。","given":"各轮均为标准齿轮：z<sub>1<\/sub>=34，z<sub>2<\/sub>=22，z<sub>3<\/sub>=78，z<sub>4<\/sub>=18，z<sub>5<\/sub>=35，z<sub>6<\/sub>=88；两齿圈3、6均固定。","img":"c8","steps":[["① 校核结构（同心条件）","z<sub>1<\/sub> + 2z<sub>2<\/sub> = 34 + 2×22 = 78 = z<sub>3<\/sub> ✓ ；z<sub>4<\/sub> + 2z<sub>5<\/sub> = 18 + 2×35 = 88 = z<sub>6<\/sub> ✓<br>说明两段都是“太阳轮—行星轮—固定内齿圈—行星架”的 2K-H 行星轮系。"],["② 第一级（1、2、3、H1）","i(1→H1)：对转化机构 i<sub>13<\/sub><sup>H1<\/sup> = (n<sub>1<\/sub>−n<sub>H1<\/sub>)/(n<sub>3<\/sub>−n<sub>H1<\/sub>) = −z<sub>3<\/sub>/z<sub>1<\/sub> = −78/34<br>固定齿圈 n<sub>3<\/sub>=0，则 (n<sub>1<\/sub>−n<sub>H1<\/sub>)/(0−n<sub>H1<\/sub>) = −78/34 ⇒ n<sub>1<\/sub>/n<sub>H1<\/sub> = 1 + 78/34 = 112/34<br>所以 i<sub>1H1<\/sub> = 1 + z<sub>3<\/sub>/z<sub>1<\/sub> = 1 + 78/34 = 3.294"],["③ 第二级（4、5、6、H2）","同理，4 为太阳轮、6 为固定齿圈：i<sub>4H2<\/sub> = 1 + z<sub>6<\/sub>/z<sub>4<\/sub> = 1 + 88/18 = 5.889"],["④ 总传动比","H1 与齿轮4固连（同一轴），故<br>i<sub>1H2<\/sub> = i<sub>1H1<\/sub>·i<sub>4H2<\/sub> = (1+78/34)(1+88/18) = 3.294×5.889 = 19.40<br>两级均为“太阳轮输入、齿圈固定、行星架输出”，故输出转向与齿轮1相同。"]],"result":"i<sub>1H2<\/sub> = 19.4（≈19.40），转向与齿轮1相同。","notes":["两级行星传动的传动比公式：i = 1 + z内齿圈/z太阳轮（齿圈固定、太阳轮输入、行星架输出）。"],"module":"train","tags":["轮系传动"]},{"id":"c9","n":9,"type":"calc","q":"在图示轮系中，已知各轮齿数 z<sub>1<\/sub>=15、z<sub>2<\/sub>=25、z<sub>2′<\/sub>=20、z<sub>3<\/sub>=20、z<sub>4<\/sub>=60、z<sub>4′<\/sub>=55，轮1为主动轮且 n<sub>1<\/sub>=110 r/min，转向如图所示。试求 n<sub>H<\/sub> 的大小和方向。","given":"z<sub>1<\/sub>=15，z<sub>2<\/sub>=25，z<sub>2′<\/sub>=20，z<sub>3<\/sub>=20，z<sub>4<\/sub>=60，z<sub>4′<\/sub>=55；轮1为主动轮，n<sub>1<\/sub>=110 r/min，转向如图所示。","img":"c9","steps":[["① 划分轮系并校核同心条件","齿轮1装在一根偏心的定轴上：它与齿轮2外啮合、与内齿圈4′内啮合，故 1-2、1-4′ 属定轴轮系（2与2′固连共轴，4与4′固连共轴）。<br>齿轮2′、3、4与行星架H组成差动轮系（2′为太阳轮、3为行星轮、4为内齿圈）。<br>校核：z<sub>2<\/sub>+2z<sub>1<\/sub> = 25+30 = 55 = z<sub>4′<\/sub> ✓ ；z<sub>2′<\/sub>+2z<sub>3<\/sub> = 20+40 = 60 = z<sub>4<\/sub> ✓"],["② 定轴轮系部分","1→2 为外啮合：n<sub>2′<\/sub> = n<sub>2<\/sub> = −(z<sub>1<\/sub>/z<sub>2<\/sub>)·n<sub>1<\/sub> = −(15/25)×110 = −66 r/min<br>1→4′ 为内啮合（转向相同，取正号）：n<sub>4<\/sub> = n<sub>4′<\/sub> = +(z<sub>1<\/sub>/z<sub>4′<\/sub>)·n<sub>1<\/sub> = +(15/55)×110 = +30 r/min"],["③ 差动轮系部分","转化机构中 2′→3 为外啮合、3→4 为内啮合，共一次外啮合，取负号：<br>i<sub>2′4<\/sub><sup>H<\/sup> = (n<sub>2′<\/sub>−n<sub>H<\/sub>)/(n<sub>4<\/sub>−n<sub>H<\/sub>) = −z<sub>4<\/sub>/z<sub>2′<\/sub> = −60/20 = −3<br>代入 n<sub>2′<\/sub>=−66、n<sub>4<\/sub>=+30：<br>(−66 − n<sub>H<\/sub>)/(30 − n<sub>H<\/sub>) = −3<br>−66 − n<sub>H<\/sub> = −90 + 3n<sub>H<\/sub><br>4n<sub>H<\/sub> = 24 ⇒ n<sub>H<\/sub> = +6 r/min"],["④ 结论","n<sub>H<\/sub> = 6 r/min，正号表示转向与轮1相同。"]],"result":"n<sub>H<\/sub> = 6 r/min，转向与轮1相同。","notes":["差动轮系的转化机构传动比按“外啮合取负、内啮合取正”确定符号：2′→3 外啮合（−）、3→4 内啮合（+），故整体取负。","定轴部分中 1→4′ 为内啮合，两轮转向相同，故取正号。"],"module":"train","tags":["轮系传动"]},{"id":"c10","n":10,"type":"calc","q":"在图示电动卷扬机减速器传动机构中，已知各轮齿数 z<sub>1<\/sub>=24、z<sub>2<\/sub>=52、z<sub>2′<\/sub>=21、z<sub>3<\/sub>=78、z<sub>3′<\/sub>=18、z<sub>4<\/sub>=30、z<sub>5<\/sub>=78，轮1为主动轮。试求齿轮系传动比 i<sub>1H<\/sub>。","given":"z<sub>1<\/sub>=24，z<sub>2<\/sub>=52，z<sub>2′<\/sub>=21，z<sub>3<\/sub>=78，z<sub>3′<\/sub>=18，z<sub>4<\/sub>=30，z<sub>5<\/sub>=78；轮1为主动轮，H为卷筒（行星架）。","img":"c10","steps":[["① 划分轮系","双联齿轮2-2′为行星轮，卷筒（带内齿圈5）为行星架H，齿轮1为太阳轮、齿轮3为内齿圈 → 组成 2K-H 行星轮系；齿轮3′、4、5（内齿圈）组成定轴轮系。齿轮3与3′固连（同一轴）。"],["② 周转轮系部分（1、2-2′、3、H）","i<sub>13<\/sub><sup>H<\/sup> = (n<sub>1<\/sub>−n<sub>H<\/sub>)/(n<sub>3<\/sub>−n<sub>H<\/sub>) = −(z<sub>2<\/sub>·z<sub>3<\/sub>)/(z<sub>1<\/sub>·z<sub>2′<\/sub>) = −(52×78)/(24×21) = −8.048<br>即 (n<sub>1<\/sub> − n<sub>H<\/sub>)/(n<sub>3<\/sub> − n<sub>H<\/sub>) = −8.048  ①"],["③ 定轴轮系部分（3′、4、5）","3′→4 为外啮合（−），4→5 为内啮合（+），故<br>i<sub>3′5<\/sub> = n<sub>3′<\/sub>/n<sub>5<\/sub> = −z<sub>5<\/sub>/z<sub>3′<\/sub> = −78/18 = −4.333<br>因为3′与3同轴、5与H（卷筒）固连，所以 n<sub>3<\/sub> = n<sub>3′<\/sub>、n<sub>5<\/sub> = n<sub>H<\/sub>，得 n<sub>3<\/sub> = −4.333n<sub>H<\/sub>  ②"],["④ 联立求解","把②代入①：<br>(n<sub>1<\/sub> − n<sub>H<\/sub>)/(−4.333n<sub>H<\/sub> − n<sub>H<\/sub>) = −8.048<br>n<sub>1<\/sub> − n<sub>H<\/sub> = (−8.048)×(−5.333)n<sub>H<\/sub> = 42.92n<sub>H<\/sub><br>n<sub>1<\/sub> = (1 + 42.92)n<sub>H<\/sub> = 43.92n<sub>H<\/sub><br>i<sub>1H<\/sub> = n<sub>1<\/sub>/n<sub>H<\/sub> = 43.9<br>正号表示卷筒的转向与齿轮1相同。"]],"result":"i<sub>1H<\/sub> = 43.9（≈43.92），卷筒转向与轮1相同。","notes":["一般表达式：i<sub>1H<\/sub> = 1 + [z<sub>2<\/sub>z<sub>3<\/sub>/(z<sub>1<\/sub>z<sub>2′<\/sub>)]·(1 + z<sub>5<\/sub>/z<sub>3′<\/sub>)。","校核中心距：3′-4 为 (18+30)/2=24，4-5（内啮合）为 (78−30)/2=24 ✓，说明该定轴轮系的划分正确。"],"module":"train","tags":["轮系传动"]},{"id":"c11","n":11,"type":"calc","q":"二级斜齿圆柱齿轮减速器中间轴用一对 32206 圆锥滚子轴承支承，C=51.8 kN，Y=1.6，e=0.37，Fs=Fr/(2Y)；Fr<sub>1<\/sub>=2500 N、Fr<sub>2<\/sub>=5000 N，n=500 r/min，Fae<sub>1<\/sub>=400 N（向右）、Fae<sub>2<\/sub>=2400 N（向左），ft=1.0，fp=1.0。当 F<sub>a<\/sub>/Fr≤e 时 X=1、Y=0；F<sub>a<\/sub>/Fr&gt;e 时 X=0.4、Y=1.6。试计算轴承寿命。","given":"C=51.8 kN，Y=1.6，e=0.37；Fr<sub>1<\/sub>=2500 N，Fr<sub>2<\/sub>=5000 N；n=500 r/min；Fae<sub>1<\/sub>=400 N（向右），Fae<sub>2<\/sub>=2400 N（向左）；ft=1.0，fp=1.0；F<sub>a<\/sub>/Fr≤e 时 X=1、Y=0；F<sub>a<\/sub>/Fr&gt;e 时 X=0.4、Y=1.6。两轴承背靠背（反装）安装。","img":"c11","steps":[["① 内部轴向力","Fs<sub>1<\/sub> = Fr<sub>1<\/sub>/(2Y) = 2500/(2×1.6) = 781.25 N<br>Fs<sub>2<\/sub> = Fr<sub>2<\/sub>/(2Y) = 5000/3.2 = 1562.5 N"],["② 判断压紧端","背靠背安装时两内部轴向力指向轴承外侧（Fs<sub>1<\/sub>向左、Fs<sub>2<\/sub>向右）。外轴向力合力 = 2400−400 = 2000 N，方向向左。<br>取向右为正：ΣF = −Fs<sub>1<\/sub> + Fs<sub>2<\/sub> − 2000 = −781.25 + 1562.5 − 2000 = −1218.75 N（向左）<br>轴有向左移动的趋势，故右端轴承2被压紧、轴承1放松。"],["③ 各轴承轴向力","Fa<sub>2<\/sub> = Fs<sub>1<\/sub> + 2000 = 781.25 + 2000 = 2781.25 N<br>Fa<sub>1<\/sub> = Fs<sub>1<\/sub> = 781.25 N"],["④ 当量动载荷","轴承1：Fa<sub>1<\/sub>/Fr<sub>1<\/sub> = 781.25/2500 = 0.31 &lt; e=0.37，取 X=1、Y=0<br>P<sub>1<\/sub> = fp·Fr<sub>1<\/sub> = 2500 N<br>轴承2：Fa<sub>2<\/sub>/Fr<sub>2<\/sub> = 2781.25/5000 = 0.556 &gt; e=0.37，取 X=0.4、Y=1.6<br>P<sub>2<\/sub> = fp(0.4Fr<sub>2<\/sub> + 1.6Fa<sub>2<\/sub>) = 0.4×5000 + 1.6×2781.25 = 2000 + 4450 = 6450 N"],["⑤ 轴承寿命（取 P=P<sub>2<\/sub>=6450 N）","L<sub>10h<\/sub> = (ft·C/P)<sup>10/3<\/sup>·10<sup>6<\/sup>/(60n) = (51800/6450)<sup>10/3<\/sup>·10<sup>6<\/sup>/(60×500)<br>= 8.031<sup>10/3<\/sup>×33.33 = 1037×33.33 = 3.46×10<sup>4<\/sup> h"]],"result":"Fa<sub>1<\/sub>=781.3 N、Fa<sub>2<\/sub>=2781.3 N；P<sub>1<\/sub>=2500 N、P<sub>2<\/sub>=6450 N；L<sub>10h<\/sub> ≈ 3.46×10<sup>4<\/sup> h。","notes":["【方法】① 求各轴承内部轴向力（圆锥滚子 Fs=Fr/(2Y)；角接触球 Fd=0.68Fr）；② 按安装形式（面对面/背靠背）确定两内部轴向力的方向，判断轴的 <script>
/* ============================================================

const TYPE_ORDER = ["fill", "mcq", "short", "analysis", "calc"];
const TYPE_INFO = {
  fill:     { name: "填空题", short: "填空" },
  mcq:      { name: "选择题", short: "选择" },

};

const ALL = [];
TYPE_ORDER.forEach(function (t) {
  BANK[t].forEach(function (q) {
    q.type = t;
    q.countable = true;
    q.no = ALL.length + 1;
    ALL.push(q);
  });
});
const BYID = {};
ALL.forEach(function (q) { BYID[q.id] = q; });

/* 知识点（专项）筛选 */
const MODULES = [
  { key: "all",        name: "全部" },
  { key: "轴承寿命",   name: "轴承寿命专项" },

  { key: "四杆机构",   name: "四杆机构" },
  { key: "轴",         name: "轴" },
  { key: "轴承",       name: "轴承" },

];

/* ---------------- 随机工具 ---------------- */
function uid() {
  return "P" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function sample(arr, n) { return shuffle(arr).slice(0, n); }

/* ---------------- 试卷生成 ---------------- */
const CALC_SLOTS = [
  { mod: "dof",     score: 7 },
  { mod: "gear",    score: 7 },
  { mod: "train",   score: 8 },
  { mod: "bearing", score: 8 }
];

function genPaper(minutes) {
  minutes = minutes || 120;
  const fillPool = BANK.fill.filter(function (q) { return !q.demo; });
  const fill = sample(fillPool, 10).map(function (q) { return { qid: q.id, score: 2 }; });
  const mcqPool = BANK.mcq.filter(function (q) { return !q.skip; });
  const mcq = sample(mcqPool, 7).map(function (q) { return { qid: q.id, score: 2 }; });
  const short = sample(BANK.short, 4).map(function (q) { return { qid: q.id, score: 5 }; });

  const anA = BANK.analysis.filter(function (q) { return q.tags.indexOf("轴系结构") >= 0; });
  const anB = BANK.analysis.filter(function (q) { return q.tags.indexOf("受力旋向") >= 0; });
  const analysis = [sample(anA, 1)[0], sample(anB, 1)[0]].map(function (q) {
    return { qid: q.id, score: 8 };
  });

  const calc = CALC_SLOTS.map(function (slot) {
    const pool = BANK.calc.filter(function (q) { return q.module === slot.mod; });
    return { qid: sample(pool, 1)[0].id, score: slot.score };
  });

  return {
    id: uid(),
    created: Date.now(),
    minutes: minutes,
    remaining: minutes * 60000,
    endAt: null,
    running: false,
    submitted: false,
    answers: {},
    sections: [
      { key: "fill",     title: "一、填空题", per: "每题 2 分（双空题每空 1 分）", score: 20, items: fill },
      { key: "mcq",      title: "二、选择题", per: "每题 2 分", score: 14, items: mcq },
      { key: "short",    title: "三、简答题", per: "每题 5 分", score: 20, items: short },
      { key: "analysis", title: "四、分析题", per: "每题 8 分（两类各抽 1 题）", score: 16, items: analysis },
      { key: "calc",     title: "五、计算题", per: "7 + 7 + 8 + 8 分（四大模块各 1 题）", score: 30, items: calc }
    ]
  };
}

function paperItems(paper) {
  const out = [];
  let no = 0;
  paper.sections.forEach(function (sec) {
    sec.items.forEach(function (it) {
      out.push({ qid: it.qid, score: it.score, section: sec.key, no: ++no });
    });
  });
  return out;
}
function paperMax(paper) {
  return paper.sections.reduce(function (s, sec) { return s + sec.score; }, 0);
}

/* ---------------- 判分 ---------------- */
function fillPerBlank(item, q) {
  return item.score / Math.max(1, q.blanks.length);
}
function itemScore(paper, it) {
  const q = BYID[it.qid];
  const a = paper.answers[it.qid] || {};
  if (it.section === "fill") {
    const per = fillPerBlank(it, q);
    let n = 0;
    (a.ok || []).forEach(function (v) { if (v) n++; });
    return per * n;
  }
  if (it.section === "mcq") return a.v === q.key ? it.score : 0;
  const v = Number(a.score || 0);
  return Math.max(0, Math.min(it.score, v));
}
function scoreOf(paper) {
  const res = { total: 0, max: 0, sections: {} };
  paper.sections.forEach(function (sec) {
    res.sections[sec.key] = { score: 0, max: sec.score, n: sec.items.length };
    res.max += sec.score;
    sec.items.forEach(function (it) {
      const s = itemScore(paper, { qid: it.qid, score: it.score, section: sec.key });
      res.sections[sec.key].score += s;
      res.total += s;
    });
  });
  res.total = Math.round(res.total * 100) / 100;
  res.max = Math.round(res.max * 100) / 100;
  return res;
}
function answeredCount(paper) {
  let n = 0;
  paperItems(paper).forEach(function (it) {
    const a = paper.answers[it.qid];
    if (!a) return;
    const q = BYID[it.qid];
    if (it.section === "fill") {
      if ((a.v || []).some(function (x) { return String(x || "").trim(); })) n++;
    } else if (it.section === "mcq") {
      if (a.v) n++;
    } else if (String(a.note || "").trim()) n++;
  });
  return n;
}

const SYNONYMS = [

function nf(s) {
  s = String(s == null ? "" : s).toLowerCase();
  s = s.replace(/[\uFF01-\uFF5E]/g, function (c) {
    return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
  });

  list.forEach(function (pair) {
    const from = nf(pair[0]);
    if (from && t.indexOf(from) >= 0) t = t.split(from).join(nf(pair[1]));

}

  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, diff = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++diff > 1) return false;
    if (a.length > b.length) i++;
    else if (a.length < b.length) j++;

}
